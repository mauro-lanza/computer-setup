[defaults]
# Local-only playbook (ansible-pull workflow). Pointing at the repo's
# static inventory silences "no inventory" / "empty hosts list" warnings
# without needing -i on every invocation.
inventory = inventory

# Quality-of-life
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

# The default callback dumps task results as single-line JSON, which escapes
# every newline in multi-line `debug` msgs (e.g. the upgrade role's pending-
# upgrades preview) into a `\n`-riddled wall of text. YAML result format uses
# a block-style ("|") string dumper instead, so multi-line msgs render as
# actual multi-line text.
callback_result_format = yaml

# Cache gathered facts to speed up repeated runs (1 hour TTL)
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 3600
