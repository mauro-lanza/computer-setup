[defaults]
inventory = inventory
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

# The default callback escapes newlines in `debug` msgs into a `\n`-riddled
# wall of text; YAML format renders multi-line messages as actual lines.
callback_result_format = yaml

# The engine's own run-state callback. `aggregate` type, so it runs ALONGSIDE
# the stdout callback above and leaves the human-readable log untouched. It is
# inert unless CS_STATE_FILE is set, so an interactive `apply` is unaffected.
callback_plugins = ./callback_plugins
callbacks_enabled = computer_setup_state

fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 3600
