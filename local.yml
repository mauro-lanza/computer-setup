---
- name: Configure macOS workstation
  hosts: localhost
  connection: local
  become: false

  vars:
    # SSH, not HTTPS: drift runs pull this repo non-interactively and HTTPS can
    # prompt for keychain credentials.
    computer_setup_repo_url: "git@github.com:mauro-lanza/computer-setup.git"
    computer_setup_repo_branch: main
    homebrew_prefix: /opt/homebrew
    home_dir: "{{ ansible_facts['env']['HOME'] }}"

    # Play-scoped, not just a role default: the layer merge in pre_tasks
    # templates repository entries that reference it.
    repositories_base_dir: "{{ home_dir }}/Projects"

    # ─── Content layers ───────────────────────────────────────────────────────
    # Every piece of machine-local state lives under one directory: the layer
    # manifest, the prefs file, and the optional repository override. One
    # literal, so "back up this machine's answers" is a single `cp -r` and the
    # paths cannot drift apart. Overridable with -e for testing.
    computer_setup_config_dir: "{{ home_dir }}/.config/computer-setup"
    # Written by bootstrap.sh. Absent = run standalone on empty defaults.
    computer_setup_layers_manifest: "{{ computer_setup_config_dir }}/layers.yml"
    computer_setup_prefs_file: "{{ computer_setup_config_dir }}/prefs.yml"
    # Cache lives outside this checkout so the drift re-clone cannot wipe it.
    # Each layer is <cache>/<name>/ with layer.yml + vars.yml + capabilities.yml
    # + files/.
    computer_setup_layer_cache: "{{ home_dir }}/.local/share/computer-setup/layers"
    # Where this system installs the executables it owns (the runner, the layer
    # sync helper, macos-capture, and any capability shipping a script). One
    # play var because three roles create and write into it; two independent
    # role defaults for the same directory could drift apart silently.
    computer_setup_bin_dir: "{{ home_dir }}/.local/bin"
    # The single entry point for operating this machine: every ansible-pull goes
    # through it, and the scheduled agents invoke its internal modes. Play-scoped
    # because drift_correction deploys it and the agents reference it.
    computer_setup_command_path: "{{ computer_setup_bin_dir }}/computer-setup"
    # Rolling log the scheduled modes append to and `computer-setup log` tails.
    computer_setup_log_file: "{{ home_dir }}/Library/Logs/computer-setup.log"
    # Highest layer schema_version this orchestrator understands.
    computer_setup_schema_version: 1

  pre_tasks:
    - name: Initialize computer-setup orchestration
      ansible.builtin.import_role:
        name: core
      tags: [always]

  roles:
    - { role: homebrew, tags: [homebrew] }
    - { role: git, tags: [git] }
    - { role: shell, tags: [shell] }
    # Editor extensions + editor settings, for whatever managers the layers
    # declare. No editor is named here: the role loops over `extension_managers`
    # and each manager carries its own capability gate.
    - { role: extensions, tags: [extensions] }
    # Deploys the `config:` bundles of every active capability. Tagged only with
    # its own name — it is one loop over all bundles, so a per-tool tag would
    # deploy every other tool's config too.
    - { role: capability_configs, tags: [capability_configs] }
    - { role: macos, tags: [macos] }
    - { role: runtimes, tags: [runtimes] }
    # `never`: the daily drift check must not clone repos, and bootstrap must not
    # try before SSH auth exists. Run with `computer-setup apply --tags repositories`.
    - { role: repositories, tags: [repositories, never] }
    # `never`: only `--tags upgrade` runs it, via the `computer-setup upgrade` helper.
    - { role: upgrade, tags: [upgrade, never] }
    - { role: drift_correction, tags: [drift_correction] }

  post_tasks:
    - name: Check GitHub CLI auth status
      ansible.builtin.command: gh auth status
      register: gh_auth
      changed_when: false
      failed_when: false
      # Read-only, so run it under --check too. `command` is skipped in check
      # mode, leaving gh_auth.rc undefined — which silently dropped the "run gh
      # auth login" line from every dry run, including bootstrap's own preview
      # on a fresh unauthenticated Mac.
      check_mode: false
      tags: [always]

    - name: Print post-setup instructions
      ansible.builtin.debug:
        msg: |
          Setup complete!
          {% if (gh_auth.rc | default(1)) != 0 %}
          - Run: gh auth login (handles SSH key + GitHub auth)
          {% endif %}
          {% for reminder in computer_setup_reminders | default([]) %}
          - {{ reminder }}
          {% endfor %}
      tags: [always]
