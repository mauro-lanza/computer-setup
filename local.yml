---
- name: Configure workstation
  hosts: localhost
  connection: local
  become: false

  vars:
    # SSH: scheduled pulls are non-interactive and HTTPS can prompt for keychain credentials.
    computer_setup_repo_url: "git@github.com:mauro-lanza/computer-setup.git"
    computer_setup_repo_branch: main
    # From the platform profile core loads (roles/core/vars/platform/); layers template against it.
    homebrew_prefix: "{{ computer_setup_platform.homebrew_prefix }}"
    home_dir: "{{ ansible_facts['env']['HOME'] }}"

    # Play-scoped because the layer merge templates repository entries against it.
    repositories_base_dir: "{{ home_dir }}/Projects"

    # All machine-local state: machine.yml, layer manifest, repository override. Overridable with -e.
    computer_setup_config_dir: "{{ home_dir }}/.config/computer-setup"
    # Written by bootstrap.sh; absent means a standalone run on empty defaults.
    computer_setup_machine_file: "{{ computer_setup_config_dir }}/machine.yml"
    computer_setup_data_dir: "{{ home_dir }}/.local/share/computer-setup"
    # Outside this checkout so the drift re-clone cannot wipe it.
    computer_setup_layer_cache: "{{ computer_setup_data_dir }}/layers"
    # Not a layer and not a cache: it can hold unpushed commits, which a layer sync hard-reset would destroy.
    computer_setup_backup_repo_dir: "{{ computer_setup_data_dir }}/backups"
    # Pinned: the ansible-pull default is hostname-keyed, and a changing mDNS suffix starts a second checkout.
    computer_setup_pull_dir: "{{ home_dir }}/.ansible/pull/computer-setup"
    # The pinned runtime (runtime.yml, roles/runtime); neither its tools nor its shims are on PATH.
    computer_setup_runtime_dir: "{{ computer_setup_data_dir }}/runtime"
    computer_setup_runtime_bin: "{{ computer_setup_runtime_dir }}/bin"
    computer_setup_runtime_tools: "{{ computer_setup_runtime_dir }}/tools"
    # Shared by the runtime role and the runner's mitogen path so neither can name a different python.
    computer_setup_runtime_pins: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/runtime.yml') | from_yaml }}"
    computer_setup_python_version: "{{ computer_setup_runtime_pins.python }}"
    # Where the engine installs its executables; three roles write here.
    computer_setup_bin_dir: "{{ home_dir }}/.local/bin"
    # Machine-local state the engine writes (run-state, galaxy marker); more than one role writes here.
    computer_setup_state_dir: "{{ home_dir }}/.local/state/computer-setup"
    # False for both scheduled modes, so no interactive `auth login` runs without a TTY.
    computer_setup_interactive: true
    # Entry point for every ansible-pull; deployed by drift_correction, invoked by the agents.
    computer_setup_command_path: "{{ computer_setup_bin_dir }}/computer-setup"
    # One log per run; see LOG_DIR in the runner. Where per the platform profile.
    computer_setup_log_dir: "{{ home_dir }}/{{ computer_setup_platform.log_dir }}"
    # The layer schema_version this orchestrator understands.
    computer_setup_schema_version: 2

  pre_tasks:
    - name: Initialize computer-setup orchestration
      ansible.builtin.import_role:
        name: core
      tags: [always]

  roles:
    # First: everything after runs under the interpreter it pins.
    - { role: runtime, tags: [runtime] }
    # One role for every package manager, each run only where core detected it;
    # see "Platforms and package managers" in docs/architecture.md.
    - { role: packages, tags: [packages] }
    - { role: git, tags: [git] }
    - { role: shell, tags: [shell] }
    # Loops over layer-declared `extension_managers`; no editor is named here.
    - { role: extensions, tags: [extensions] }
    # One loop over all bundles, so it has no per-tool tag.
    - { role: capability_configs, tags: [capability_configs] }
    - { role: macos, tags: [macos], when: "computer_setup_platform.system_settings == 'osx_defaults'" }
    - { role: runtimes, tags: [runtimes] }
    # Merges into ~/.docker/config.json, which holds auths/credsStore this orchestrator must not own;
    # see "path_helper can defeat the PATH snippet's own prepend logic" in docs/findings.md.
    - { role: docker, tags: [docker] }
    # `never`: the drift check must not clone repos, and bootstrap runs before SSH auth exists.
    - { role: repositories, tags: [repositories, never] }
    # `never`: runs only via `computer-setup upgrade`.
    - { role: upgrade, tags: [upgrade, never] }
    # After capability_configs (a config deploy may create the credential store).
    - { role: logins, tags: [logins] }
    # Deploys the `computer-setup` command the agents invoke.
    - { role: drift_correction, tags: [drift_correction] }
    # Last, after drift_correction and capability_configs, whose programs the agents invoke;
    # see "Partial failures are reported at the end of the play" in docs/findings.md.
    # The profile names the scheduler; Linux has none yet, so its runs are interactive.
    - { role: scheduled_agents, tags: [scheduled_agents], when: "computer_setup_platform.scheduler == 'launchd'" }

  post_tasks:
    # Reported here so every role runs first; see "Partial failures are reported at the end of the play" in docs/findings.md.
    - name: Report packages that need root and got no sudo password
      ansible.builtin.fail:
        msg: |-
          {{ _missing | length }} package(s) need root to install and no sudo
          password was given: {{ _missing | join(', ') }}.
          Everything else completed. Re-run `computer-setup apply` from a
          terminal and enter your password when asked.
      vars:
        _missing: "{{ packages_unprivileged_missing | default([]) }}"
      when: _missing | length > 0
      tags: [packages]
    - name: Report casks that could not be installed
      ansible.builtin.fail:
        msg: |-
          {{ _failed | length }} cask(s) could not be installed. Everything else
          completed, including the scheduled agents.
          {% for f in _failed %}
            • {{ f.item }}: {{ (f.msg | default('')) | trim | truncate(300) }}
          {% endfor %}
          "sudo: a terminal is required" means the cask needs root to place a
          helper (e.g. a container app symlinking a credential helper into
          /usr/local/bin). An Ansible task never has a terminal, so sudo cannot
          prompt. Either:
            • re-run bootstrap.sh and give your password when it asks, or
            • install that one by hand, where sudo can prompt:
                brew install --cask <name>
          Everything else is already configured; re-running is safe and cheap.
      vars:
        _failed: >-
          {{ (packages_cask_results | default({})).get('results', [])
             | selectattr('failed', 'defined') | selectattr('failed') | list }}
      when: _failed | length > 0
      tags: [packages]

    # Same reason as the casks: osx_defaults fails hard on a wrong `type:`.
    - name: Report macOS defaults that could not be applied
      ansible.builtin.fail:
        msg: |-
          {{ _failed | length }} macOS default(s) could not be applied. Everything
          else completed, including the scheduled agents.
          {% for f in _failed %}
            • {{ f.item.domain }} {{ f.item.key }} (declared {{ f.item.type }}): {{ (f.msg | default('')) | trim }}
          {% endfor %}
          "Type mismatch" means the key already exists with a different type, and
          osx_defaults will not convert it. macOS writes some keys as `int` that
          dotfiles conventionally set as `bool` — trackpad `Clicking` is one.
          Make the layer match the live type:
            defaults read-type <domain> <key>
          Beware: a machine this playbook already configured reports the type THIS
          PLAYBOOK wrote, not the one macOS uses natively. Trust a fresh machine.
      vars:
        _failed: >-
          {{ (macos_defaults_results | default({})).get('results', [])
             | selectattr('failed', 'defined') | selectattr('failed') | list }}
      when: _failed | length > 0
      tags: [macos]

    - name: Check GitHub CLI auth status
      ansible.builtin.command: gh auth status
      register: gh_auth
      changed_when: false
      failed_when: false
      # Read-only; see "Probes under --check" in docs/architecture.md.
      check_mode: false
      tags: [always]

    - name: Print post-setup instructions
      ansible.builtin.debug:
        msg: |
          Setup complete!
          {% if (gh_auth.rc | default(1)) != 0 %}
          - Run: gh auth login (handles SSH key + GitHub auth)
          {% endif %}
          {% for reminder in computer_setup_reminders | default([]) %}
          - {{ reminder }}
          {% endfor %}
      tags: [always]
