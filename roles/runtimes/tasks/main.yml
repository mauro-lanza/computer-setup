---
# Version managers. Each tool is gated on its capability being active AND the
# tool actually being installed — the capability gate is the intent, the stat is
# the execution guard (we can't drive a CLI that isn't there). Managers become
# active by selection or via adopt_if_present.
#
# The capability ids are vars, not literals, so a layer may register a manager
# under a different id. The task bodies stay bespoke on purpose — see
# defaults/main.yml for why they are not layer data.
- name: Check if nvm is installed (to converge the default Node alias)
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
  register: runtimes_nvm_script
  when: runtimes_nvm_capability in (computer_setup_active_capabilities | default([]))

- name: Read current NVM default alias
  ansible.builtin.slurp:
    src: "{{ home_dir }}/.nvm/alias/default"
  register: runtimes_nvm_current_alias
  failed_when: false
  when: runtimes_nvm_script.stat.exists | default(false)

- name: Install default Node.js version via NVM
  # Keep the version spec QUOTED. It is `lts/*` by default, i.e. data that looks
  # like a glob. This ran under zsh, whose NOMATCH option makes an unmatched
  # glob fatal: the shell aborted with "no matches found: lts/*" before `nvm`
  # was ever invoked, taking the whole play with it — and drift_correction runs
  # after this role, so a fresh machine ended up with no LaunchAgents at all.
  #
  # Now bash, which leaves an unmatched glob as a literal, so that failure mode
  # is gone rather than merely avoided. The quotes stay regardless: they are
  # what makes the value data instead of a pattern.
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm install '{{ runtimes_nvm_default_node }}'
    nvm alias default '{{ runtimes_nvm_default_node }}'
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - runtimes_nvm_script.stat.exists | default(false)
    # `failed_when: false` on the slurp above means it never reports failed, so
    # the missing-file case surfaces here as an absent `.content` instead.
    - (runtimes_nvm_current_alias.content | default('') | b64decode | trim) != runtimes_nvm_default_node

- name: Check if tfenv is available
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/tfenv"
  register: runtimes_tfenv_stat
  when: runtimes_tfenv_capability in (computer_setup_active_capabilities | default([]))

- name: Read current tfenv Terraform version
  ansible.builtin.command:
    argv:
      - tfenv
      - version-name
  register: runtimes_tfenv_current_version
  changed_when: false
  failed_when: false
  # Read-only, so it must run under --check too: otherwise the register has no
  # stdout and the install task below skips on an undefined rc, hiding a version
  # change from the drift check. Same as "[{{ manager }}] List installed
  # extensions" in the extensions role. The upgrade role's `brew outdated` tasks
  # deliberately do NOT get this — see "brew outdated" in docs/findings.md.
  check_mode: false
  when:
    - runtimes_tfenv_stat.stat.exists | default(false)
    - runtimes_tfenv_terraform_version | length > 0

- name: Install and activate Terraform version via tfenv
  # Quoted for the same reason as the nvm task above: a version spec is data,
  # and unquoted data one glob character away from being treated as a pattern.
  ansible.builtin.shell: |
    tfenv install '{{ runtimes_tfenv_terraform_version }}'
    tfenv use '{{ runtimes_tfenv_terraform_version }}'
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - runtimes_tfenv_stat.stat.exists | default(false)
    - runtimes_tfenv_terraform_version | length > 0
    - runtimes_tfenv_current_version.rc != 0
      or (runtimes_tfenv_current_version.stdout | trim) != runtimes_tfenv_terraform_version

# ─── Drift visibility under --check ──────────────────────────────────────────
# The two install tasks above are `shell`, and command/shell modules do NOT
# execute under --check: Ansible reports them as "skipping", never "changed".
# The scheduled 10:00 check counts `changed=` from the play recap, so a Node or
# Terraform version switched by hand was invisible — `tfenv use 1.5.0` reported
# "no drift" indefinitely.
#
# Those tasks cannot simply gain `check_mode: false`; that would make a dry run
# actually install. So state the finding instead. A `debug` task DOES run in
# check mode, and `changed_when` makes it count toward the drift total.
- name: Report runtime version drift
  ansible.builtin.debug:
    msg: >-
      {{ item.tool }}: '{{ item.current }}' is active but '{{ item.declared }}'
      is declared — `computer-setup apply` will converge it.
  changed_when: true
  when:
    - ansible_check_mode
    - item.managed | bool
    - item.current != item.declared
  loop:
    - tool: Node (nvm default alias)
      managed: "{{ runtimes_nvm_script.stat.exists | default(false) }}"
      current: "{{ runtimes_nvm_current_alias.content | default('') | b64decode | trim }}"
      declared: "{{ runtimes_nvm_default_node }}"
    - tool: Terraform (tfenv)
      managed: >-
        {{ (runtimes_tfenv_stat.stat.exists | default(false))
           and (runtimes_tfenv_terraform_version | length > 0) }}
      current: "{{ runtimes_tfenv_current_version.stdout | default('') | trim }}"
      declared: "{{ runtimes_tfenv_terraform_version }}"
  loop_control:
    label: "{{ item.tool }}"
