---
# Version managers, each gated on its capability being active and the tool being
# installed. Bodies are bespoke on purpose; see defaults/main.yml.
- name: Warn that version managers are Homebrew-only for now
  ansible.builtin.debug:
    msg: >-
      nvm and tfenv are probed under the Homebrew prefix, which is not
      supported on {{ computer_setup_platform.name }}; their versions are not converged.
  when:
    - computer_setup_platform.name != 'Darwin'
    - (runtimes_nvm_capability in computer_setup_active_capabilities)
      or (runtimes_tfenv_capability in computer_setup_active_capabilities)

- name: Check if nvm is installed (to converge the default Node alias)
  ansible.builtin.stat:
    path: "{{ runtimes_nvm_script_path }}"
  register: runtimes_nvm_script
  when: runtimes_nvm_capability in computer_setup_active_capabilities

- name: Read current NVM default alias
  ansible.builtin.slurp:
    src: "{{ home_dir }}/.nvm/alias/default"
  register: runtimes_nvm_current_alias
  failed_when: false
  when: runtimes_nvm_script.stat.exists | default(false)

- name: Install default Node.js version via NVM
  # Version specs stay quoted: `lts/*` is a glob to a shell. See "nvm and tfenv
  # version specs must be quoted" in docs/findings.md.
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm install '{{ runtimes_nvm_default_node }}'
    nvm alias default '{{ runtimes_nvm_default_node }}'
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - runtimes_nvm_script.stat.exists | default(false)
    # A failed slurp never reports failed, so a missing file shows up as an absent `.content`.
    - (runtimes_nvm_current_alias.content | default('') | b64decode | trim) != runtimes_nvm_default_node

- name: Check if tfenv is available
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/tfenv"
  register: runtimes_tfenv_stat
  when: runtimes_tfenv_capability in computer_setup_active_capabilities

- name: Read current tfenv Terraform version
  ansible.builtin.command:
    argv:
      - tfenv
      - version-name
  register: runtimes_tfenv_current_version
  changed_when: false
  failed_when: false
  # Read-only; see "Probes under --check" in docs/architecture.md.
  check_mode: false
  when:
    - runtimes_tfenv_stat.stat.exists | default(false)
    - runtimes_tfenv_terraform_version | length > 0

- name: Install and activate Terraform version via tfenv
  # Quoted for the same reason as the nvm task.
  ansible.builtin.shell: |
    tfenv install '{{ runtimes_tfenv_terraform_version }}'
    tfenv use '{{ runtimes_tfenv_terraform_version }}'
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - runtimes_tfenv_stat.stat.exists | default(false)
    - runtimes_tfenv_terraform_version | length > 0
    - runtimes_tfenv_current_version.rc != 0
      or (runtimes_tfenv_current_version.stdout | trim) != runtimes_tfenv_terraform_version

# Drift visibility under --check: the install tasks are `shell` and skipped, so
# report the drift here (see "Probes under --check" in docs/architecture.md).
- name: Report runtime version drift
  ansible.builtin.debug:
    msg: >-
      {{ item.tool }}: '{{ item.current }}' is active but '{{ item.declared }}'
      is declared — `computer-setup apply` will converge it.
  changed_when: true
  when:
    - ansible_check_mode
    - item.managed | bool
    - item.current != item.declared
  loop:
    - tool: Node (nvm default alias)
      managed: "{{ runtimes_nvm_script.stat.exists | default(false) }}"
      current: "{{ runtimes_nvm_current_alias.content | default('') | b64decode | trim }}"
      declared: "{{ runtimes_nvm_default_node }}"
    - tool: Terraform (tfenv)
      managed: >-
        {{ (runtimes_tfenv_stat.stat.exists | default(false))
           and (runtimes_tfenv_terraform_version | length > 0) }}
      current: "{{ runtimes_tfenv_current_version.stdout | default('') | trim }}"
      declared: "{{ runtimes_tfenv_terraform_version }}"
  loop_control:
    label: "{{ item.tool }}"
