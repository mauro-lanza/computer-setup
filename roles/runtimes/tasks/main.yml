---
# Version managers. Each tool is gated on its capability being active AND the
# tool actually being installed — the capability gate is the intent, the stat is
# the execution guard (we can't drive a CLI that isn't there). Managers become
# active by selection or via adopt_if_present.
#
# The capability ids are vars, not literals, so a layer may register a manager
# under a different id. The task bodies stay bespoke on purpose — see
# defaults/main.yml for why they are not layer data.
- name: Check if nvm is available
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
  register: runtimes_nvm_script
  when: runtimes_nvm_capability in (computer_setup_active_capabilities | default([]))

- name: Read current NVM default alias
  ansible.builtin.slurp:
    src: "{{ home_dir }}/.nvm/alias/default"
  register: runtimes_nvm_current_alias
  failed_when: false
  when: runtimes_nvm_script.stat.exists | default(false)

- name: Install default Node.js version via NVM
  # The version spec MUST be quoted. The default is `lts/*`, and this runs under
  # zsh, whose NOMATCH option makes an unmatched glob a fatal error: the shell
  # aborts with "no matches found: lts/*" before `nvm` is ever invoked, failing
  # the task and taking the whole play with it (drift_correction runs after this
  # role, so a fresh machine ended up with no LaunchAgents and no drift CLI).
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm install '{{ runtimes_nvm_default_node }}'
    nvm alias default '{{ runtimes_nvm_default_node }}'
  args:
    executable: /bin/zsh
  changed_when: true
  when:
    - runtimes_nvm_script.stat.exists | default(false)
    - runtimes_nvm_current_alias is failed
      or (runtimes_nvm_current_alias.content | default('') | b64decode | trim) != runtimes_nvm_default_node

- name: Check if tfenv is available
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/tfenv"
  register: runtimes_tfenv_stat
  when: runtimes_tfenv_capability in (computer_setup_active_capabilities | default([]))

- name: Read current tfenv Terraform version
  ansible.builtin.command:
    argv:
      - tfenv
      - version-name
  register: runtimes_tfenv_current_version
  changed_when: false
  failed_when: false
  when:
    - runtimes_tfenv_stat.stat.exists | default(false)
    - runtimes_tfenv_terraform_version | length > 0

- name: Install and activate Terraform version via tfenv
  # Quoted for the same reason as the nvm task above — a version spec is data,
  # and unquoted data reaching zsh is one glob character away from a fatal
  # NOMATCH error.
  ansible.builtin.shell: |
    tfenv install '{{ runtimes_tfenv_terraform_version }}'
    tfenv use '{{ runtimes_tfenv_terraform_version }}'
  args:
    executable: /bin/zsh
  changed_when: true
  when:
    - runtimes_tfenv_stat.stat.exists | default(false)
    - runtimes_tfenv_terraform_version | length > 0
    - runtimes_tfenv_current_version.rc != 0
      or (runtimes_tfenv_current_version.stdout | trim) != runtimes_tfenv_terraform_version
