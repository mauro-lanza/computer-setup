---
# `repositories_base_dir` is NOT defaulted here. It is a play var (local.yml),
# because the layer merge in pre_tasks templates repository entries against it —
# and a role default would be shadowed by the play var anyway, leaving two
# literals for one value.

# Optional per-machine override. When present it fully replaces the merged
# `repositories` list — for a machine needing repos beyond what the layers
# provide. Kept in $HOME, not committed. Scaffold one with `repos-generate`.
repositories_override_file: "{{ home_dir }}/.repositories.yml"

# Safe empty default — the real list is the variable interface `repositories`,
# supplied and list-appended across content layers. Cloning only adds what is
# missing; existing checkouts are never fetched, reset, or pruned.
repositories: []
