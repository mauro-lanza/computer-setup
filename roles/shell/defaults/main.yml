---
# Layers supply all shell content; these are the only knobs.

# Directory of managed zsh snippets, sourced by a layer-provided ~/.zshrc.
shell_zsh_config_dir: "{{ home_dir }}/.zsh"

# Zero-padding of the layer-priority prefix: sourcing is a lexical glob, so at width 2 priority 100 would sort before 20. 3 covers 0-999.
shell_priority_width: 3

# Paths created by this role; cleanup removes only these, never user files in ~/.zsh.
shell_snippet_manifest_path: "{{ shell_zsh_config_dir }}/.computer-setup-snippets"

# Whole-file shell configs, set by layers. Item schema: { key: <layer file key>, dest: <path>, backup?: bool }
shell_config_files: []

# Absolute path of the login shell to set for the current user (chsh), e.g.
# /usr/bin/zsh. Empty leaves the login shell alone. It must be listed in /etc/shells.
shell_login_shell: ""
