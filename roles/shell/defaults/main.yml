---
# The shell role holds no shell content — aliases, functions, integrations, the
# prompt, and ~/.zshrc all come from content layers. These are the only knobs:

# Directory of managed zsh snippets. A layer-provided ~/.zshrc sources
# everything in here (e.g. `for f in ~/.zsh/*.zsh(N); do source $f; done`).
shell_zsh_config_dir: "{{ home_dir }}/.zsh"

# Zero-padding width for the layer-priority prefix on deployed snippets. Sourcing
# is a lexical glob, so the prefix must sort lexically the way it sorts
# numerically: at width 2, priority 100 renders "100-" and sorts BEFORE "20-",
# silently inverting load order. 3 digits covers priorities 0-999.
shell_priority_width: 3

# Tracks layer snippets created by this role. Cleanup only removes paths listed
# here from a previous run, so user-created files in ~/.zsh are never inferred as
# managed based on their filename alone.
shell_snippet_manifest_path: "{{ shell_zsh_config_dir }}/.computer-setup-snippets"

# Whole-file shell configs resolved across layers. Keys are layer data, so a
# layer using starship instead of Powerlevel10k just changes this list.
#
# Item schema: { key: <layer file key>, dest: <path>, backup?: bool }
shell_config_files:
  - key: zshrc
    dest: "{{ home_dir }}/.zshrc"
    # A file the user may have authored themselves.
    backup: true
  - key: p10k.zsh
    dest: "{{ home_dir }}/.p10k.zsh"
