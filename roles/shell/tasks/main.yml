---
# The shell role is a generic process: it deploys the orchestrator's own CLI
# snippet, then whatever zsh content the active content layers provide. It holds
# no shell content of its own — aliases, functions, integrations, and ~/.zshrc
# all come from layers (files/shell/*.zsh, files/zshrc).

- name: Create managed shell config directory
  ansible.builtin.file:
    path: "{{ shell_zsh_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy computer-setup shell CLI
  ansible.builtin.template:
    src: computer-setup-cli.zsh.j2
    dest: "{{ shell_zsh_config_dir }}/{{ shell_cli_snippet_name }}"
    mode: "0644"
  notify: Shell config changed

# ─── Layer-provided shell snippets ────────────────────────────────────────────
# Gather files/shell/*.zsh from every active layer and deploy them into ~/.zsh,
# prefixed with the layer priority + name so load order is deterministic (lower
# priority first) and multiple layers never collide.
#
# A snippet may opt into a capability gate with a directive on its own line:
#   # cs:requires-capability: <name>
# The engine then deploys it only when <name> is an active capability. This
# keeps the orchestrator content-agnostic — it never hardcodes layer filenames.
- name: Discover layer shell snippets
  ansible.builtin.find:
    paths: "{{ computer_setup_layer_cache }}/{{ item.name }}/files/shell"
    patterns: "*.zsh"
    file_type: file
  loop: "{{ computer_setup_active_layers | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: shell_layer_find

# Build one candidate list carrying every discovered snippet's source, its
# deterministic managed dest (priority + layer name + filename), and whether its
# capability gate is satisfied. The deploy map and the candidate-path list (used
# for stale cleanup) are then both derived from this — the dest is computed once.
- name: Build the shell snippet candidate list
  ansible.builtin.set_fact:
    shell_snippet_candidates: >-
      {{ (shell_snippet_candidates | default([])) + [{
           'src': _f.1.path,
           'dest': shell_zsh_config_dir ~ '/'
                   ~ (('%0' ~ (shell_priority_width | int) ~ 'd')
                      | format(_f.0.item.priority | int))
                   ~ '-' ~ _f.0.item.name ~ '-' ~ (_f.1.path | basename),
           'enabled': (_cap | length == 0)
                      or (_cap in (computer_setup_active_capabilities | default([])))
         }] }}
  loop: "{{ shell_layer_find.results | subelements('files', skip_missing=True) }}"
  loop_control:
    loop_var: _f
    label: "{{ _f.0.item.name }}/{{ _f.1.path | basename }}"
  vars:
    _cap: >-
      {{ (lookup('ansible.builtin.file', _f.1.path)
          | regex_search('(?m)^#\s*cs:requires-capability:\s*(\S+)', '\1')
          | default([], true)) | join('') }}

- name: Derive the deploy map and candidate paths
  ansible.builtin.set_fact:
    # Only gate-satisfied snippets are deployed (extra 'enabled' key is harmless).
    shell_snippet_map: "{{ shell_snippet_candidates | default([]) | selectattr('enabled') | list }}"
    # Every discovered snippet's dest — so a now-disabled one is cleaned up.
    shell_snippet_candidate_paths: "{{ shell_snippet_candidates | default([]) | map(attribute='dest') | list }}"

- name: Deploy layer shell snippets
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop: "{{ shell_snippet_map | default([]) }}"
  loop_control:
    label: "{{ item.dest | basename }}"
  notify: Shell config changed

# Reconcile: remove only layer snippets this role created on a previous run and
# no longer creates now. User-created ~/.zsh/*.zsh files are not inferred as
# managed from their filename.
- name: Check previous shell snippet manifest
  ansible.builtin.stat:
    path: "{{ shell_snippet_manifest_path }}"
  register: shell_snippet_manifest

- name: Read previous shell snippet manifest
  ansible.builtin.slurp:
    path: "{{ shell_snippet_manifest_path }}"
  register: shell_snippet_manifest_data
  when: shell_snippet_manifest.stat.exists

- name: Resolve stale shell snippets from previous manifest
  ansible.builtin.set_fact:
    shell_stale_snippets: >-
      {{ (((shell_snippet_manifest_data.content | default('') | b64decode).splitlines()
           if shell_snippet_manifest.stat.exists else [])
          + (shell_snippet_candidate_paths | default([])))
         | reject('equalto', '')
         | unique
         | difference(shell_snippet_map | default([]) | map(attribute='dest') | list) }}

- name: Remove stale shell snippets
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ shell_stale_snippets }}"
  loop_control:
    label: "{{ item | basename }}"
  notify: Shell config changed

# A run that deploys zero snippets (no layer ships files/shell/*.zsh, or every
# snippet is gated off by `# cs:requires-capability:`) must write an EMPTY file,
# not "\n": "\n".splitlines() is [''], and that empty string then survives into
# the stale-removal loop above as `file: path="" state=absent`. It happens to
# no-op rather than fail, which is exactly the kind of accident that stops being
# an accident later. The reject() above is the belt; this is the braces.
- name: Write current shell snippet manifest
  ansible.builtin.copy:
    dest: "{{ shell_snippet_manifest_path }}"
    mode: "0644"
    content: "{{ (_dests | sort | join('\n') ~ '\n') if _dests | length > 0 else '' }}"
  vars:
    _dests: "{{ shell_snippet_map | default([]) | map(attribute='dest') | list }}"

# ─── ~/.zshrc (layer content) ─────────────────────────────────────────────────
# Resolved across layer files/ dirs (highest priority wins). The orchestrator
# ships no ~/.zshrc of its own — a layer must provide one (it sources ~/.zsh/*.zsh
# plus the prompt and plugins). Skipped if no layer provides it.
- name: Deploy ~/.zshrc from layers
  ansible.builtin.include_role:
    name: computer_setup
    tasks_from: deploy_layer_file
  vars:
    computer_setup_lookup_key: zshrc
    computer_setup_deploy_dest: "{{ home_dir }}/.zshrc"
    computer_setup_lookup_fallback_dir: "{{ playbook_dir }}/roles/shell/files"
    computer_setup_deploy_backup: true
    computer_setup_deploy_notify: Shell config changed

# ─── ~/.p10k.zsh (layer content) ──────────────────────────────────────────────
# Resolved across layer files/ dirs (highest priority wins), skipped if absent.
- name: Deploy Powerlevel10k prompt configuration from layers
  ansible.builtin.include_role:
    name: computer_setup
    tasks_from: deploy_layer_file
  vars:
    computer_setup_lookup_key: p10k.zsh
    computer_setup_deploy_dest: "{{ home_dir }}/.p10k.zsh"
    computer_setup_lookup_fallback_dir: "{{ playbook_dir }}/roles/shell/files"
    computer_setup_deploy_notify: Shell config changed
