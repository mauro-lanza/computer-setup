---
# The shell role deploys whatever zsh content the active content layers provide.
# It holds no shell content of its own — aliases, functions, integrations, and
# ~/.zshrc all come from layers (files/shell/*.zsh, files/zshrc), and the
# engine's own commands are a script in ~/.local/bin, not a sourced snippet.

- name: Create managed shell config directory
  ansible.builtin.file:
    path: "{{ shell_zsh_config_dir }}"
    state: directory
    mode: "0755"

# ─── Layer-provided shell snippets ────────────────────────────────────────────
# Gather files/shell/*.zsh from every active layer and deploy them into ~/.zsh,
# prefixed with the layer priority + name so load order is deterministic (lower
# priority first) and multiple layers never collide.
#
# A snippet may opt into a capability gate with a directive on its own line:
#   # cs:requires-capability: <name>
# The engine then deploys it only when <name> is an active capability. This
# keeps the orchestrator content-agnostic — it never hardcodes layer filenames.
#
# A snippet named `*.zsh.j2` is rendered as a template instead of copied, and
# lands at the same dest with the .j2 stripped. That is how a snippet reaches
# layer vars (homebrew_prefix, a Python version, an active-capability list)
# rather than repeating them as literals.
#
# Each candidate carries its source, its deterministic managed dest (priority +
# layer name + filename) and whether its capability gate is satisfied; the deploy
# map and the stale-cleanup paths are both derived from this list. `fileglob`
# yields nothing for a layer without files/shell, so no stat is needed.
- name: Build the shell snippet candidate list
  ansible.builtin.set_fact:
    shell_snippet_candidates: >-
      {{ (shell_snippet_candidates | default([])) + [{
           'src': _path,
           'dest': shell_zsh_config_dir ~ '/'
                   ~ (('%0' ~ (shell_priority_width | int) ~ 'd')
                      | format(_layer.priority | int))
                   ~ '-' ~ _layer.name ~ '-'
                   ~ (_path | basename | regex_replace('\.j2$', '')),
           'template': _path.endswith('.j2'),
           'enabled': (_cap | length == 0)
                      or (_cap in computer_setup_active_capabilities)
         }] }}
  loop: "{{ query('ansible.builtin.fileglob', *_globs) }}"
  loop_control:
    loop_var: _path
    label: "{{ _layer.name }}/{{ _path | basename }}"
  vars:
    _layers: "{{ computer_setup_active_layers | default([]) }}"
    _globs: >-
      {{ _layers | map(attribute='name')
         | map('regex_replace', '^', computer_setup_layer_cache ~ '/')
         | map('regex_replace', '$', '/files/shell/')
         | product(['*.zsh', '*.zsh.j2']) | map('join') | list }}
    _layer: >-
      {{ _layers | selectattr('name', 'eq', _path | relpath(computer_setup_layer_cache) | split('/') | first)
         | first }}
    _cap: >-
      {{ (lookup('ansible.builtin.file', _path)
          | regex_search('(?m)^#\s*cs:requires-capability:\s*(\S+)', '\1')
          | default([], true)) | join('') }}

- name: Derive the deploy map and candidate paths
  ansible.builtin.set_fact:
    # Only gate-satisfied snippets are deployed (extra 'enabled' key is harmless).
    shell_snippet_map: "{{ shell_snippet_candidates | default([]) | selectattr('enabled') | list }}"
    # Every discovered snippet's dest — so a now-disabled one is cleaned up.
    shell_snippet_candidate_paths: "{{ shell_snippet_candidates | default([]) | map(attribute='dest') | list }}"

- name: Deploy layer shell snippets
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop: "{{ shell_snippet_map | rejectattr('template') | list }}"
  loop_control:
    label: "{{ item.dest | basename }}"
  notify: Shell config changed

- name: Render layer shell snippet templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop: "{{ shell_snippet_map | selectattr('template') | list }}"
  loop_control:
    label: "{{ item.dest | basename }}"
  notify: Shell config changed

# Reconcile: remove only layer snippets this role created on a previous run and
# no longer creates now. User-created ~/.zsh/*.zsh files are not inferred as
# managed from their filename.
- name: Resolve stale shell snippets from previous manifest
  ansible.builtin.set_fact:
    shell_stale_snippets: >-
      {{ ((lookup('ansible.builtin.file', shell_snippet_manifest_path)
            if shell_snippet_manifest_path is file else '').splitlines()
          + shell_snippet_candidate_paths)
         | reject('equalto', '')
         | unique
         | difference(shell_snippet_map | map(attribute='dest') | list) }}

- name: Remove stale shell snippets
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ shell_stale_snippets }}"
  loop_control:
    label: "{{ item | basename }}"
  notify: Shell config changed

# Zero snippets must write an EMPTY file, not "\n": "\n".splitlines() is [''],
# and that empty string reaches the stale-removal loop above as
# `file: path="" state=absent`. The reject('equalto', '') there also guards it.
- name: Write current shell snippet manifest
  ansible.builtin.copy:
    dest: "{{ shell_snippet_manifest_path }}"
    mode: "0644"
    content: "{{ (_dests | sort | join('\n') ~ '\n') if _dests | length > 0 else '' }}"
  vars:
    _dests: "{{ shell_snippet_map | map(attribute='dest') | list }}"

# ─── Whole-file shell configs (layer content) ─────────────────────────────────
# Resolved across layer files/ and templates/ dirs (highest priority wins), each
# skipped if no layer provides it. The orchestrator ships none of its own — a
# layer must provide ~/.zshrc, or no shell config is deployed at all.
#
# The list is data (`shell_config_files`), so no particular prompt or shell
# config file is assumed by the engine.
- name: Deploy layer-provided shell config files
  ansible.builtin.include_role:
    name: core
    tasks_from: deploy_layer_file
  vars:
    computer_setup_lookup_key: "{{ item.key }}"
    computer_setup_deploy_dest: "{{ item.dest }}"
    computer_setup_deploy_backup: "{{ item.backup | default(false) }}"
    computer_setup_deploy_notify: Shell config changed
  loop: "{{ shell_config_files }}"
  loop_control:
    label: "{{ item.dest | basename }}"
