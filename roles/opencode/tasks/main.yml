---
# The GitHub MCP token is injected at runtime via the OC_GITHUB_PERSONAL_ACCESS_TOKEN
# environment variable ({env:...} in the config) — no secret is stored in the repo.
- name: Deploy opencode config from layers
  ansible.builtin.include_role:
    name: computer_setup
    tasks_from: deploy_layer_file
  vars:
    computer_setup_lookup_key: opencode.json
    computer_setup_deploy_dest: "{{ opencode_config_dir }}/opencode.json"
    computer_setup_lookup_fallback_dir: "{{ role_path }}/files"
