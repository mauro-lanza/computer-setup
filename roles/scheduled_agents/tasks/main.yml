---
# Split the declared agents into those that should exist on this machine and
# those that should not. Computed once so the deploy and the teardown below can
# never disagree about which is which — a plist that fell out of the "wanted"
# set must be actively booted out, not merely left unwritten.
#
# Two sources, two independent kill switches: the engine's own agents (gated by
# `drift_correction_enabled`) and the layer-declared ones (gated by
# `scheduled_agents_enabled`). `_declared` is the union regardless, so an agent
# that either switch just turned off still gets torn down rather than orphaned.
- name: Resolve which scheduled agents apply to this machine
  ansible.builtin.set_fact:
    _scheduled_agents_wanted: "{{ _wanted }}"
    # Compared by label, not with the `difference` filter: these are dicts, and
    # set-based difference on unhashable items is not something to rely on.
    _scheduled_agents_unwanted: >-
      {{ _declared
         | rejectattr('label', 'in', _wanted | map(attribute='label') | list)
         | list }}
  vars:
    _declared: "{{ scheduled_agents_engine + scheduled_agents }}"
    _eligible: >-
      {{ (scheduled_agents_engine if (drift_correction_enabled | bool) else [])
         + (scheduled_agents if (scheduled_agents_enabled | bool) else []) }}
    _capability_ok: >-
      {{ _eligible
         | rejectattr('requires_capability', 'defined')
         | list
         + (_eligible
            | selectattr('requires_capability', 'defined')
            | selectattr('requires_capability', 'in',
                         computer_setup_active_capabilities | default([]))
            | list) }}
    _wanted: >-
      {{ _capability_ok | selectattr('enabled', 'defined') | selectattr('enabled') | list
         + (_capability_ok | rejectattr('enabled', 'defined') | list) }}

- name: Validate scheduled agent definitions
  ansible.builtin.assert:
    that:
      - agent.label is defined and agent.label | length > 0
      - agent.program is defined and agent.program | length > 0
      - agent.hour is defined and (agent.hour | int) >= 0 and (agent.hour | int) <= 23
      - agent.minute is defined and (agent.minute | int) >= 0 and (agent.minute | int) <= 59
    fail_msg: >-
      Invalid scheduled_agents entry: {{ agent }}. Requires `label`, `program`,
      `hour` (0-23) and `minute` (0-59). A malformed plist is accepted silently
      by launchd and simply never fires, so this is checked here instead.
    quiet: true
  loop: "{{ _scheduled_agents_wanted }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.label | default('<no label>') }}"

# Match macOS default permissions for pre-existing system directories.
# Unconditional: the `computer-setup` runner appends to a log in here on every
# scheduled run, so the directory must exist even when no agent is installed.
- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ scheduled_agents_log_dir }}"
    state: directory
    mode: "0700"

- name: Ensure ~/Library/LaunchAgents exists
  ansible.builtin.file:
    path: "{{ home_dir }}/Library/LaunchAgents"
    state: directory
    mode: "0755"
  when: _scheduled_agents_wanted | length > 0

- name: Deploy scheduled LaunchAgent plists
  ansible.builtin.template:
    src: launchagent.plist.j2
    dest: "{{ home_dir }}/Library/LaunchAgents/{{ agent.label }}.plist"
    mode: "0644"
  loop: "{{ _scheduled_agents_wanted }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.label }} (@ {{ agent.hour }}:{{ '%02d' | format(agent.minute | int) }})"
  notify: Reload scheduled user agents

# ─── Reconcile ───────────────────────────────────────────────────────────────
# Turning an agent off must actually stop it, not just stop rewriting the plist.
# An orphaned plist stays loaded across reboots, so the job keeps running long
# after the machine said no.
#
# `_scheduled_agents_unwanted` covers an agent still DECLARED but disabled — by
# `enabled: false`, a kill switch, or a capability going away. It cannot cover an
# agent whose entry was DELETED from a layer outright: nothing declares it, so
# nothing names it, and its plist was orphaned and left loaded forever. That is
# what the manifest below fixes.
#
# Beside the plists it tracks, exactly as the shell role keeps
# `.computer-setup-snippets` beside its snippets. launchd only loads `*.plist`,
# so a dotfile here is inert. It records LABELS, not paths, because unloading
# needs the label and the path is derived from it.
#
# This role reaps its own agents rather than leaving them to a generic file
# collector for a reason that will not go away: an agent is not just a file.
# Deleting the plist without `launchctl bootout` leaves the job running until
# the next reboot, so removal has an ordering requirement no path-based
# collector can honour.
- name: Check the previous scheduled agent manifest
  ansible.builtin.stat:
    path: "{{ scheduled_agents_manifest_path }}"
  register: _scheduled_agents_manifest

- name: Read the previous scheduled agent manifest
  ansible.builtin.slurp:
    src: "{{ scheduled_agents_manifest_path }}"
  register: _scheduled_agents_manifest_data
  when: _scheduled_agents_manifest.stat.exists

- name: Resolve scheduled agents to tear down
  ansible.builtin.set_fact:
    # Previously deployed, plus still-declared-but-unwanted, minus wanted.
    # `reject('equalto', '')` because an empty manifest splits to [''], which
    # would otherwise reach the teardown loop as a label of "".
    _scheduled_agents_stale: >-
      {{ (((_scheduled_agents_manifest_data.content | default('') | b64decode).splitlines()
            if _scheduled_agents_manifest.stat.exists else [])
          + (_scheduled_agents_unwanted | map(attribute='label') | list))
         | reject('equalto', '')
         | unique
         | difference(_scheduled_agents_wanted | map(attribute='label') | list) }}

- name: Unload scheduled agents that no longer apply
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ ansible_facts['user_uid'] }} {{ home_dir }}/Library/LaunchAgents/{{ item }}.plist
  loop: "{{ _scheduled_agents_stale }}"
  register: _scheduled_agents_bootout
  changed_when: _scheduled_agents_bootout.rc == 0
  # Not loaded (or never was) is the desired end state, not an error.
  failed_when: false
  when: scheduled_agents_activate | bool

- name: Remove plists for scheduled agents that no longer apply
  ansible.builtin.file:
    path: "{{ home_dir }}/Library/LaunchAgents/{{ item }}.plist"
    state: absent
  loop: "{{ _scheduled_agents_stale }}"

# Written last, and only from what is actually wanted, so a run that failed
# before deploying does not record agents it never wrote. Zero agents must write
# an EMPTY file rather than "\n" — see the same trap in the shell role.
- name: Write the current scheduled agent manifest
  ansible.builtin.copy:
    dest: "{{ scheduled_agents_manifest_path }}"
    mode: "0644"
    content: "{{ (_labels | sort | join('\n') ~ '\n') if _labels | length > 0 else '' }}"
  vars:
    _labels: "{{ _scheduled_agents_wanted | map(attribute='label') | list }}"
  # The directory above is only created when something is wanted. A machine that
  # has never had an agent has nothing to record and no directory to record it
  # in; one that had them keeps the directory, so the empty manifest still
  # lands and the next run knows the reaping is done.
  when: _scheduled_agents_wanted | length > 0 or _scheduled_agents_manifest.stat.exists
