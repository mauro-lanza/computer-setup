---
# Computed once so deploy and teardown agree. `_declared` is the union of both
# sources, so an agent a kill switch just turned off is torn down, not orphaned.
- name: Resolve which scheduled agents apply to this machine
  ansible.builtin.set_fact:
    _scheduled_agents_wanted: "{{ _wanted }}"
    # By label: set difference on dicts is unreliable.
    _scheduled_agents_unwanted: >-
      {{ _declared
         | rejectattr('label', 'in', _wanted | map(attribute='label') | list)
         | list }}
  vars:
    _declared: "{{ scheduled_agents_engine + scheduled_agents }}"
    _eligible: >-
      {{ (scheduled_agents_engine if (drift_correction_enabled | bool) else [])
         + (scheduled_agents if (scheduled_agents_enabled | bool) else []) }}
    _capability_ok: >-
      {{ _eligible
         | rejectattr('requires_capability', 'defined')
         | list
         + (_eligible
            | selectattr('requires_capability', 'defined')
            | selectattr('requires_capability', 'in',
                         computer_setup_active_capabilities)
            | list) }}
    _wanted: >-
      {{ _capability_ok | selectattr('enabled', 'defined') | selectattr('enabled') | list
         + (_capability_ok | rejectattr('enabled', 'defined') | list) }}

- name: Validate scheduled agent definitions
  ansible.builtin.assert:
    that:
      - agent.label is defined and agent.label | length > 0
      - agent.program is defined and agent.program | length > 0
      - agent.hour is defined and (agent.hour | int) >= 0 and (agent.hour | int) <= 23
      - agent.minute is defined and (agent.minute | int) >= 0 and (agent.minute | int) <= 59
    fail_msg: >-
      Invalid scheduled_agents entry: {{ agent }}. Requires `label`, `program`,
      `hour` (0-23) and `minute` (0-59). A malformed plist is accepted silently
      by launchd and simply never fires, so this is checked here instead.
    quiet: true
  loop: "{{ _scheduled_agents_wanted }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.label | default('<no label>') }}"

# Where agent stdout/stderr go; the runner's own logs use `computer_setup_log_dir`.
- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ scheduled_agents_log_dir }}"
    state: directory
    mode: "0700"

- name: Ensure ~/Library/LaunchAgents exists
  ansible.builtin.file:
    path: "{{ home_dir }}/Library/LaunchAgents"
    state: directory
    mode: "0755"
  when: _scheduled_agents_wanted | length > 0

- name: Deploy scheduled LaunchAgent plists
  ansible.builtin.template:
    src: launchagent.plist.j2
    dest: "{{ home_dir }}/Library/LaunchAgents/{{ agent.label }}.plist"
    mode: "0644"
  loop: "{{ _scheduled_agents_wanted }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.label }} (@ {{ agent.hour }}:{{ '%02d' | format(agent.minute | int) }})"
  notify: Reload scheduled user agents

# Turning an agent off must stop it (an orphaned plist stays loaded across
# reboots). `_scheduled_agents_unwanted` covers declared-but-disabled agents; the
# manifest covers agents deleted from a layer outright. It records labels, not
# paths, because unloading needs the label. This role reaps its own agents since
# `launchctl bootout` must precede deleting the plist, which a path-based
# collector cannot honour.
- name: Resolve scheduled agents to tear down
  ansible.builtin.set_fact:
    _scheduled_agents_previous: "{{ _previous }}"
    # Previously deployed, plus still-declared-but-unwanted, minus wanted.
    _scheduled_agents_stale: >-
      {{ (_previous + (_scheduled_agents_unwanted | map(attribute='label') | list))
         | unique
         | difference(_scheduled_agents_wanted | map(attribute='label') | list) }}
  vars:
    # Only a missing manifest is empty; an unreadable one must fail. Empty splits to [''], hence the reject.
    _previous: >-
      {{ (lookup('ansible.builtin.file', scheduled_agents_manifest_path)
          if scheduled_agents_manifest_path is file else '').splitlines()
         | reject('equalto', '') | list }}

- name: Unload scheduled agents that no longer apply
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ ansible_facts['user_uid'] }} {{ home_dir }}/Library/LaunchAgents/{{ item }}.plist
  loop: "{{ _scheduled_agents_stale }}"
  register: _scheduled_agents_bootout
  changed_when: _scheduled_agents_bootout.rc == 0
  # Not loaded (or never was) is the desired end state, not an error.
  failed_when: false
  when: scheduled_agents_activate | bool

- name: Remove plists for scheduled agents that no longer apply
  ansible.builtin.file:
    path: "{{ home_dir }}/Library/LaunchAgents/{{ item }}.plist"
    state: absent
  loop: "{{ _scheduled_agents_stale }}"

# Written last and only from what is wanted, so a failed run records nothing it
# did not write. Zero agents writes an EMPTY file, not "\n" (same trap as the shell role).
- name: Write the current scheduled agent manifest
  ansible.builtin.copy:
    dest: "{{ scheduled_agents_manifest_path }}"
    mode: "0644"
    content: "{{ (_labels | sort | join('\n') ~ '\n') if _labels | length > 0 else '' }}"
  vars:
    _labels: "{{ _scheduled_agents_wanted | map(attribute='label') | list }}"
  # The LaunchAgents directory exists only once something was wanted; once agents existed, the empty manifest still lands.
  when: _scheduled_agents_wanted | length > 0 or _scheduled_agents_previous | length > 0
