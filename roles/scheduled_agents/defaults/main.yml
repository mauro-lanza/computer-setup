---
# Turns the `scheduled_agents` data list into user LaunchAgents and owns the
# launchctl lifecycle that `capability_configs` cannot: launchd ignores a
# rewritten plist and keeps running a deleted one.
# Layers may write this list; `drift_correction_` is reserved only for the
# engine's own agents, and a layer could already ship an executable and a plist.
#
# Entry schema (label, program, hour, minute required):
#   - label: com.example.job          # also names the plist and its logs
#     program: /path/to/executable
#     args: ["--flag"]                # optional
#     hour: 8                         # 0-23
#     minute: 30                      # 0-59
#     enabled: true                   # optional, default true
#     requires_capability: some-id    # optional; skipped unless active
scheduled_agents: []

scheduled_agents_enabled: true

# False only in tests: the launchd GUI domain is machine-global, so teardown would touch the developer's own session.
scheduled_agents_activate: true

scheduled_agents_log_dir: "{{ home_dir }}/Library/Logs"

# Labels deployed on the previous run, so an agent deleted from a layer can still be unloaded. A dotfile, so launchd ignores it.
scheduled_agents_manifest_path: "{{ home_dir }}/Library/LaunchAgents/.computer-setup-agents"

# The engine's own agents, kept apart from `scheduled_agents` so a layer cannot
# retask them; gated by `drift_correction_enabled`. Upgrade runs before the check
# so its results do not look like drift.
scheduled_agents_engine:
  - label: com.computer-setup.upgrade
    program: "{{ computer_setup_command_path }}"
    args: [_scheduled-upgrade]
    hour: "{{ drift_correction_upgrade_schedule_hour }}"
    minute: "{{ drift_correction_upgrade_schedule_minute }}"
  - label: com.computer-setup.check
    program: "{{ computer_setup_command_path }}"
    args: [_scheduled-check]
    hour: "{{ drift_correction_schedule_hour }}"
    minute: "{{ drift_correction_schedule_minute }}"
