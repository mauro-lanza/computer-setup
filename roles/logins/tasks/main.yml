---
# Report credentials a person still has to obtain; the remedy runs only when
# `computer_setup_interactive`. See "Logins" in docs/architecture.md.

- name: Resolve which logins apply to this machine
  ansible.builtin.set_fact:
    _logins_wanted: >-
      {{ (_eligible | rejectattr('requires_capability', 'defined') | list)
         + (_eligible
            | selectattr('requires_capability', 'defined')
            | selectattr('requires_capability', 'in',
                         computer_setup_active_capabilities)
            | list) }}
  vars:
    _eligible: "{{ logins if (logins_enabled | bool) else [] }}"

# Layer data, so it is wrong in a layer repo rather than here.
- name: Validate login definitions
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.desc is defined
      - item.detect_file is defined
      - item.remedy is defined
    fail_msg: >-
      Login entry {{ item.id | default('(no id)') }} must define id, desc,
      detect_file and remedy.
    quiet: true
  loop: "{{ _logins_wanted }}"
  loop_control:
    label: "{{ item.id | default('(no id)') }}"

# Read-only (see "Probes under --check" in docs/architecture.md); the exit code
# becomes drift naming the missing login.
- name: Check for each declared credential
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-c', _logins_probe_src, item.detect_file]
         + ([item.detect_key] if item.detect_key is defined else []) }}
  vars:
    # Inline, not deployed; prints nothing from the file. See "Logins" in docs/architecture.md.
    _logins_probe_src: |
      import json, os, sys
      path = os.path.expanduser(sys.argv[1])
      if not os.path.exists(path) or os.path.getsize(path) == 0:
          sys.exit(1)
      if len(sys.argv) < 3:
          sys.exit(0)   # existence is the whole check for a non-JSON store
      try:
          with open(path) as handle:
              data = json.load(handle)
      except Exception:
          sys.exit(1)   # unreadable or not JSON: never claim "present"
      sys.exit(0 if isinstance(data, dict) and sys.argv[2] in data else 1)
  register: _logins_probe
  loop: "{{ _logins_wanted }}"
  loop_control:
    label: "{{ item.id }}"
  check_mode: false
  changed_when: _logins_probe.rc != 0
  failed_when: false

- name: Collect the logins still missing
  ansible.builtin.set_fact:
    _logins_missing: >-
      {{ _logins_probe.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

# Interactive only; scheduled modes report below instead.
- name: Sign in to each missing credential
  ansible.builtin.command: "{{ item.remedy }}"
  loop: "{{ _logins_missing }}"
  loop_control:
    label: "{{ item.desc }}"
  when: computer_setup_interactive | bool
  changed_when: true
  # A cancelled browser flow must not fail the play; the next run reports it again.
  failed_when: false

- name: Report credentials that still need a person
  ansible.builtin.debug:
    msg: >-
      {{ _logins_missing | map(attribute='desc') | list }} still need signing
      in. Run `computer-setup apply` from a terminal, or the command directly:
      {{ _logins_missing | map(attribute='remedy') | list }}
  when:
    - _logins_missing | length > 0
    - not (computer_setup_interactive | bool)
