---
# Credentials a person has to obtain, declared by layers; checked, not reminded
# (see "Logins" in docs/architecture.md). Each entry:
#   id                  stable token, used in messages
#   desc                what a human is being asked to sign in to
#   detect_file         the credential store; its EXISTENCE is the check
#   detect_key          optional: require this key inside it (JSON only)
#   remedy              the command that obtains the credential
#   requires_capability optional: skip entirely unless that capability is active
logins: []

logins_enabled: true
