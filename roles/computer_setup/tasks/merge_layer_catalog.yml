---
# Merge one content layer's catalog.yml into the accumulated capability registry
# (a dict keyed by capability id). Loop var: `_layer`. Layers are processed in
# ascending priority, so a higher-priority layer's declaration of the same id
# overwrites (wins over) a lower one — matching the scalar-merge rule for vars.
#
# The registry is the single source of truth, read by both bootstrap (to build
# the selection menu) and the engine (to derive packages/config from the user's
# selected_capabilities). The engine therefore never hardcodes package names.

- name: "[{{ _layer.name }}] Stat catalog.yml"
  ansible.builtin.stat:
    path: "{{ computer_setup_plugin_cache }}/{{ _layer.name }}/catalog.yml"
  register: _layer_catalog_stat

- name: "[{{ _layer.name }}] Load catalog.yml"
  ansible.builtin.include_vars:
    file: "{{ computer_setup_plugin_cache }}/{{ _layer.name }}/catalog.yml"
    name: _incoming_catalog
  when: _layer_catalog_stat.stat.exists

- name: "[{{ _layer.name }}] Merge catalog entries into the capability registry"
  ansible.builtin.set_fact:
    computer_setup_capability_registry: >-
      {{ computer_setup_capability_registry
         | combine(dict((_incoming_catalog.catalog | default([]) | map(attribute='id'))
                        | zip(_incoming_catalog.catalog | default([])))) }}
  when: _layer_catalog_stat.stat.exists
