---
# Merge a single content layer's vars.yml into the accumulated merged set.
# Loop var: `_layer` — a manifest entry: { name, priority }.

- name: "[{{ _layer.name }}] Read plugin manifest"
  ansible.builtin.include_vars:
    file: "{{ computer_setup_plugin_cache }}/{{ _layer.name }}/plugin.yml"
    name: _layer_plugin

- name: "[{{ _layer.name }}] Assert supported schema_version"
  ansible.builtin.assert:
    that:
      - (_layer_plugin.schema_version | default(1) | int) <= (computer_setup_schema_version | int)
    fail_msg: >-
      Layer '{{ _layer.name }}' requires schema_version
      {{ _layer_plugin.schema_version | default(1) }}, but this orchestrator
      supports up to {{ computer_setup_schema_version }}. Update computer-setup.
    quiet: true

- name: "[{{ _layer.name }}] Stat vars.yml"
  ansible.builtin.stat:
    path: "{{ computer_setup_plugin_cache }}/{{ _layer.name }}/vars.yml"
  register: _layer_vars_stat

- name: "[{{ _layer.name }}] Load vars.yml"
  ansible.builtin.include_vars:
    file: "{{ computer_setup_plugin_cache }}/{{ _layer.name }}/vars.yml"
    name: _incoming_layer_vars
  when: _layer_vars_stat.stat.exists

- name: "[{{ _layer.name }}] Assert vars.yml does not define reserved keys"
  ansible.builtin.assert:
    that:
      - (_incoming_layer_vars.keys() | intersect(computer_setup_reserved_layer_keys | default([])) | length) == 0
      - (_incoming_layer_vars.keys() | select('match', _reserved_prefix_re) | list | length) == 0
    fail_msg: >-
      Layer '{{ _layer.name }}' defines reserved key(s):
      {{ ((_incoming_layer_vars.keys() | intersect(computer_setup_reserved_layer_keys | default([])))
          + (_incoming_layer_vars.keys() | select('match', _reserved_prefix_re) | list)) | unique | join(', ') }}.
      These are machine-local prefs (use {{ computer_setup_prefs_file }}) or
      engine-owned vars (the
      {{ computer_setup_reserved_layer_prefixes | default([]) | join('*, ') }}*
      namespaces) — not layer content.
    quiet: true
  vars:
    _reserved_prefix_re: "^({{ computer_setup_reserved_layer_prefixes | default(['computer_setup_']) | join('|') }})"
  when: _layer_vars_stat.stat.exists

- name: "[{{ _layer.name }}] Report scalar overrides (highest priority wins)"
  ansible.builtin.debug:
    msg: >-
      Layer '{{ _layer.name }}' overrides scalar '{{ item.key }}':
      '{{ computer_setup_merged_vars[item.key] }}' -> '{{ item.value }}'
  loop: "{{ (_incoming_layer_vars | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - _layer_vars_stat.stat.exists
    - item.key in computer_setup_merged_vars
    - item.value is string or item.value is number or item.value is boolean
    - computer_setup_merged_vars[item.key] != item.value

- name: "[{{ _layer.name }}] Merge into accumulated vars (lists append, scalars override)"
  ansible.builtin.set_fact:
    computer_setup_merged_vars: >-
      {{ computer_setup_merged_vars
         | combine(_layer_vars_clean, recursive=true, list_merge='append_rp') }}
  vars:
    # Drop keys whose value is null before merging. A layer author writing
    #     homebrew_baseline_formulae:
    # (the key, no entries) means "nothing here", but YAML parses it as None —
    # which is DEFINED, so the consuming role's `| default([])` does not fire and
    # the value flows on to crash something far away with an unattributed
    # "'NoneType' object is not iterable". Dropping the key instead lets the
    # role's own default apply, which is exactly what the author meant. Cheaper
    # and friendlier than asserting, and it retires the whole class rather than
    # one key at a time.
    _layer_vars_clean: >-
      {{ (_incoming_layer_vars | default({}) | dict2items
          | rejectattr('value', 'none') | list | items2dict)
         if (_incoming_layer_vars | default({})) else {} }}
  when: _layer_vars_stat.stat.exists
