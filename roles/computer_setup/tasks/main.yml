---
- name: Assert supported platform (macOS Apple Silicon)
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Darwin'
      - ansible_facts['architecture'] == 'arm64'
    fail_msg: >-
      This playbook supports macOS on Apple Silicon (arm64) only.
      Detected: {{ ansible_facts['system'] }} / {{ ansible_facts['architecture'] }}.
    success_msg: "Platform check passed: macOS arm64"

- name: Check if preferences file exists
  ansible.builtin.stat:
    path: "{{ computer_setup_prefs_file }}"
  register: prefs_file

- name: Load user preferences
  when: prefs_file.stat.exists
  block:
    - name: Read user preferences file
      ansible.builtin.include_vars:
        file: "{{ computer_setup_prefs_file }}"
  rescue:
    - name: Warn about malformed preferences file
      ansible.builtin.debug:
        msg: >-
          WARNING: ~/.mac-prefs.yml is malformed or unreadable.
          Re-run bootstrap.sh to regenerate. Continuing with defaults.

- name: Seed the accumulated layer vars
  ansible.builtin.set_fact:
    computer_setup_merged_vars: {}
    computer_setup_active_layers: []
    computer_setup_capability_registry: {}
    computer_setup_question_registry: {}
    # Whole namespaces a layer's vars.yml may never touch. Reserved by PREFIX,
    # not enumeration, so a newly added engine var is protected automatically.
    #
    # `upgrade_` is deliberately not reserved — upgrade_casks_exclude is
    # legitimate layer content. Only the two auto-approval switches are, below.
    computer_setup_reserved_layer_prefixes:
      - computer_setup_
      - drift_correction_
    # Individual keys a layer may never define:
    #   1. Machine-local prefs — belong in computer_setup_prefs_file.
    #   2. Engine-owned play vars — overriding these breaks the orchestrator.
    #   3. Anything deciding what code runs unattended. Layer vars land in play
    #      scope via set_fact, outranking role defaults AND play vars, so these
    #      would be arbitrary remote-code control if a layer repo were compromised.
    # Keys a QUESTION may set even though a layer's vars.yml may not. This is
    # the machine tier: the decision is machine-local, so a layer must not make
    # it, but the machine must be able to. Deliberately an enumeration, not a
    # prefix — widening it is a security decision and should require an edit
    # here, with a reason.
    #
    # Everything in docs/architecture.md category 3 stays unreachable: these are
    # WHERE things go and WHEN the agent runs, not WHAT CODE runs. repo_url,
    # repo_branch, the upgrade auto-approval switches and the ansible_* controls
    # are not here and must not be added.
    computer_setup_machine_tier_keys:
      - repositories_base_dir
      - drift_correction_enabled
      - drift_correction_schedule_hour
      - drift_correction_upgrade_schedule_hour
    computer_setup_reserved_layer_keys:
      - selected_capabilities
      - answers
      - git_user_name
      - git_user_email
      - home_dir
      - repo_url
      - repo_branch
      - homebrew_prefix
      - repositories_base_dir
      - repositories_override_file
      # Would let a layer turn the unattended morning upgrade into a full cask
      # upgrade, or auto-approve upgrades the operator never confirmed.
      - upgrade_assume_yes
      - upgrade_include_casks
      # Ansible's own execution controls.
      - ansible_connection
      - ansible_python_interpreter
      - ansible_shell_executable
      - ansible_become
      - ansible_become_user

- name: Check for a layers manifest
  ansible.builtin.stat:
    path: "{{ computer_setup_layers_manifest }}"
  register: layers_manifest_stat

- name: Load and merge content layers
  when: layers_manifest_stat.stat.exists
  block:
    - name: Read the layers manifest
      ansible.builtin.include_vars:
        file: "{{ computer_setup_layers_manifest }}"
        name: _layers_manifest

    - name: Resolve active layers (ascending priority — highest wins last)
      ansible.builtin.set_fact:
        computer_setup_active_layers: >-
          {{ (_layers_manifest.layers | default([], true))
             | sort(attribute='priority') }}

    # ─── Questions and answers ────────────────────────────────────────────────────
    # Questions are layer-declared; answers are machine-local (prefs file).
    #
    # ORDER MATTERS, and it is not the obvious one. Answers are applied TWICE:
    #
    #   1. before the layer var merge, so a layer's vars.yml can template against an
    #      answer the way it templates against a play var. `repositories_base_dir` is
    #      the reason: layers write `folder: "{{ repositories_base_dir }}/thing"`, and
    #      include_vars templates those values as it reads them. Applied only after
    #      the merge, answering "put my repos in ~/src" would have templated the old
    #      value into every repository entry and silently done nothing.
    #   2. after the merge, so an answer still OUTRANKS a layer var of the same name.
    #      The machine is more specific than the layer that proposed the question.
    - name: Merge each layer's questions.yml into the question registry
      ansible.builtin.include_tasks: merge_layer_questions.yml
      loop: "{{ computer_setup_active_layers }}"
      loop_control:
        loop_var: _layer
        label: "{{ _layer.name }}"

    - name: Resolve the answer to every registered question
      # An unanswered question falls back to its declared default, so a prefs file
      # written before the question existed still yields a complete answer set. An
      # answer to a question no layer declares any more is dropped rather than
      # carried as a phantom var.
      ansible.builtin.set_fact:
        computer_setup_answers: "{{ _defaults | combine(_given_known) }}"
      vars:
        _reg: "{{ computer_setup_question_registry }}"
        _defaults: >-
          {{ dict(_reg.keys() | zip(_reg.values() | map(attribute='default', default=''))) }}
        _given_known: >-
          {{ (answers | default({}, true)) | dict2items
             | selectattr('key', 'in', _reg.keys() | list) | list | items2dict }}

    - name: Assert every select answer is one of its declared options
      ansible.builtin.assert:
        that:
          - computer_setup_answers[item.key] in (item.value.options | map(attribute='value') | list)
        fail_msg: >-
          Answer '{{ computer_setup_answers[item.key] }}' for question
          '{{ item.key }}' is not one of its options
          ({{ item.value.options | map(attribute='value') | join(', ') }}).
          Fix `answers.{{ item.key }}` in {{ computer_setup_prefs_file }}, or re-run
          bootstrap.sh.
        quiet: true
      loop: >-
        {{ computer_setup_question_registry | dict2items
           | selectattr('value.type', 'eq', 'select') | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: Accumulate the answers' variable payloads
      # Two forms, both optional:
      #   question-level `set_var: <name>`  -> <name> = the raw answer
      #   option-level   `set: {k: v}`      -> literal vars, when that option is chosen
      ansible.builtin.set_fact:
        computer_setup_answer_vars: >-
          {{ (computer_setup_answer_vars | default({}))
             | combine(_from_question) | combine(_from_option) }}
      loop: "{{ computer_setup_question_registry | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        _a: "{{ computer_setup_answers[item.key] }}"
        _from_question: >-
          {{ {item.value.set_var: _a} if item.value.set_var is defined else {} }}
        _chosen: >-
          {{ (item.value.options | default([]) | selectattr('value', 'eq', _a) | list) }}
        _from_option: >-
          {{ (_chosen | first).set | default({}) if _chosen | length > 0 else {} }}

    - name: Expose the answers' variable payloads as play scope
      # These land exactly as a layer var does, and cleared the same reserved-key
      # guard at merge time. They run after the layer var merge, so an answer
      # outranks a layer's proposal.
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_answer_vars | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Merge each layer's vars.yml
      ansible.builtin.include_tasks: merge_layer_vars.yml
      loop: "{{ computer_setup_active_layers }}"
      loop_control:
        loop_var: _layer
        label: "{{ _layer.name }} (priority {{ _layer.priority }})"

    - name: Expose merged layer vars as the role interface
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_merged_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Re-apply the answers over the merged layer vars
      # Second application (see the ordering note above): the first let layer
      # vars template against an answer; this one makes the answer win when a
      # layer defines the same key.
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_answer_vars | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: Build the cross-layer file search path
  ansible.builtin.set_fact:
    computer_setup_file_search_dirs: >-
      {{ (computer_setup_active_layers | reverse | list)
         | map(attribute='name')
         | map('regex_replace', '^(.*)$', computer_setup_layer_cache + '/\1/files')
         | list }}

- name: Build the cross-layer template search path
  ansible.builtin.set_fact:
    computer_setup_template_search_dirs: >-
      {{ (computer_setup_active_layers | reverse | list)
         | map(attribute='name')
         | map('regex_replace', '^(.*)$', computer_setup_layer_cache + '/\1/templates')
         | list }}

- name: Merge each layer's capabilities.yml into the capability registry
  ansible.builtin.include_tasks: merge_layer_capabilities.yml
  loop: "{{ computer_setup_active_layers }}"
  loop_control:
    loop_var: _layer
    label: "{{ _layer.name }}"

- name: Fold capability implications from the answers into the selection
  # A `select` option may declare `implies: [id, ...]`, the generic dependency
  # edge: choosing an editor selects the capability that installs it.
  ansible.builtin.set_fact:
    selected_capabilities: "{{ (_selected + _implied) | unique | list }}"
  vars:
    _selected: "{{ selected_capabilities | default([], true) }}"
    _implied: >-
      {{ computer_setup_question_registry | dict2items
         | map(attribute='value') | selectattr('options', 'defined')
         | map(attribute='options') | flatten
         | selectattr('value', 'in', computer_setup_answers.values() | list)
         | selectattr('implies', 'defined') | map(attribute='implies')
         | flatten | unique | list }}

- name: Probe for adoptable capabilities already present
  # A capability declaring `adopt_if_present: <path>` becomes active when that
  # path exists, even if never selected — so an already-configured machine is
  # adopted and kept managed. The engine hardcodes no tool paths.
  ansible.builtin.stat:
    path: "{{ item.value.adopt_if_present }}"
  loop: >-
    {{ computer_setup_capability_registry | dict2items
       | selectattr('value.adopt_if_present', 'defined') | list }}
  loop_control:
    label: "{{ item.key }}"
  register: _adopt_probe

- name: Resolve active capabilities (selected + adoptable-present)
  ansible.builtin.set_fact:
    computer_setup_active_capabilities: "{{ (_selected + _present) | unique | list }}"
  vars:
    _selected: "{{ selected_capabilities | default([], true) }}"
    _present: >-
      {{ _adopt_probe.results | default([])
         | selectattr('stat.exists') | map(attribute='item.key') | list }}

- name: Derive the role interface from capabilities
  ansible.builtin.set_fact:
    # Packages come from SELECTED capabilities (install what you picked); config
    # and reminders from ACTIVE ones (also manage what is already present).
    homebrew_optional_formulae: >-
      {{ _selected_entries | selectattr('type', 'eq', 'formula')
         | map(attribute='packages') | map('split') | flatten | list }}
    homebrew_optional_casks: >-
      {{ _selected_entries | selectattr('type', 'eq', 'cask')
         | map(attribute='packages') | map('split') | flatten | list }}
    # Extensions, grouped by the manager that installs them. Previously this was
    # a single `vscode_optional_extensions` list and `type: vscode` — the editor
    # was named in the engine. A capability now says `type: extension` plus
    # `manager: <id>`, and the manager itself is layer data.
    extension_optional: >-
      {{ dict(_ext_grouped | map(attribute=0)
              | zip(_ext_grouped | map(attribute=1)
                    | map('map', attribute='packages')
                    | map('join', ' ') | map('split') | list)) }}
    # Flattened list of config deploys ({src, dest, kind?}) from active caps.
    computer_setup_config_deploys: >-
      {{ _active_entries | selectattr('config', 'defined')
         | map(attribute='config') | flatten | list }}
    # Post-setup reminder strings contributed by active capabilities.
    computer_setup_reminders: >-
      {{ _active_entries | selectattr('reminders', 'defined')
         | map(attribute='reminders') | flatten | list }}
  vars:
    _selected: "{{ selected_capabilities | default([], true) }}"
    _active: "{{ computer_setup_active_capabilities }}"
    _selected_entries: >-
      {{ _selected | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry) | list }}
    _active_entries: >-
      {{ _active | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry) | list }}
    # groupby gives [(manager, [entries]), …]; each group's `packages` strings
    # are joined and re-split, so several capabilities may feed one manager.
    _ext_grouped: >-
      {{ _selected_entries | selectattr('type', 'eq', 'extension')
         | groupby('manager') }}
