---
- name: Assert supported platform (macOS Apple Silicon)
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Darwin'
      - ansible_facts['architecture'] == 'arm64'
    fail_msg: >-
      This playbook supports macOS on Apple Silicon (arm64) only.
      Detected: {{ ansible_facts['system'] }} / {{ ansible_facts['architecture'] }}.
    success_msg: "Platform check passed: macOS arm64"

- name: Check if preferences file exists
  ansible.builtin.stat:
    path: "{{ computer_setup_prefs_file }}"
  register: prefs_file

- name: Load user preferences
  when: prefs_file.stat.exists
  block:
    - name: Read user preferences file
      ansible.builtin.include_vars:
        file: "{{ computer_setup_prefs_file }}"
  rescue:
    - name: Warn about malformed preferences file
      ansible.builtin.debug:
        msg: >-
          WARNING: ~/.mac-prefs.yml is malformed or unreadable.
          Re-run bootstrap.sh to regenerate. Continuing with defaults.

- name: Seed the accumulated layer vars
  ansible.builtin.set_fact:
    computer_setup_merged_vars: {}
    computer_setup_active_layers: []
    computer_setup_capability_registry: {}
    # Keys a layer's vars.yml may never define. Two groups:
    #   1. Machine-local prefs — belong in computer_setup_prefs_file.
    #   2. Engine-owned play/role vars — a layer overriding these would break
    #      the orchestrator itself. The computer_setup_* namespace is additionally
    #      guarded by prefix in merge_layer_vars.yml.
    computer_setup_reserved_layer_keys:
      - selected_capabilities
      - git_user_name
      - git_user_email
      - home_dir
      - repo_url
      - repo_branch
      - homebrew_prefix
      - vscode_code_binary
      - repositories_base_dir

- name: Check for a layers manifest
  ansible.builtin.stat:
    path: "{{ computer_setup_layers_manifest }}"
  register: layers_manifest_stat

- name: Load and merge content layers
  when: layers_manifest_stat.stat.exists
  block:
    - name: Read the layers manifest
      ansible.builtin.include_vars:
        file: "{{ computer_setup_layers_manifest }}"
        name: _layers_manifest

    - name: Resolve active layers (ascending priority — highest wins last)
      ansible.builtin.set_fact:
        computer_setup_active_layers: >-
          {{ (_layers_manifest.layers | default([]))
             | sort(attribute='priority') }}

    - name: Merge each layer's vars.yml
      ansible.builtin.include_tasks: merge_layer_vars.yml
      loop: "{{ computer_setup_active_layers }}"
      loop_control:
        loop_var: _layer
        label: "{{ _layer.name }} (priority {{ _layer.priority }})"

    - name: Expose merged layer vars as the role interface
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_merged_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: Build the cross-layer file search path
  ansible.builtin.set_fact:
    computer_setup_file_search_dirs: >-
      {{ (computer_setup_active_layers | reverse | list)
         | map(attribute='name')
         | map('regex_replace', '^(.*)$', computer_setup_plugin_cache + '/\1/files')
         | list }}

- name: Build the cross-layer template search path
  ansible.builtin.set_fact:
    computer_setup_template_search_dirs: >-
      {{ (computer_setup_active_layers | reverse | list)
         | map(attribute='name')
         | map('regex_replace', '^(.*)$', computer_setup_plugin_cache + '/\1/templates')
         | list }}

- name: Merge each layer's catalog.yml into the capability registry
  ansible.builtin.include_tasks: merge_layer_catalog.yml
  loop: "{{ computer_setup_active_layers }}"
  loop_control:
    loop_var: _layer
    label: "{{ _layer.name }}"

- name: Check if gcloud SDK is installed
  ansible.builtin.stat:
    path: "{{ home_dir }}/google-cloud-sdk"
  register: gcloud_sdk_dir

- name: Check if dbt is already configured on this machine
  ansible.builtin.stat:
    path: "{{ home_dir }}/.dbt/profiles.yml"
  register: dbt_profiles_stat

- name: Check if VS Code is already installed
  ansible.builtin.stat:
    path: "{{ vscode_code_binary }}"
  register: vscode_binary_stat

- name: Resolve active capabilities (selected + adoptable-present)
  ansible.builtin.set_fact:
    # The explicit selections (deterministic record).
    computer_setup_capabilities: "{{ _selected }}"
    # Effective set everything gates on: selections plus tools we can detect and
    # adopt on an already-configured machine. (Presence paths become data-driven
    # via a per-capability `adopt_if_present` in a later step.)
    computer_setup_active_capabilities: >-
      {{ (_selected
          + (['dbt'] if dbt_profiles_stat.stat.exists else [])
          + (['vscode'] if vscode_binary_stat.stat.exists else [])
          + (['gcloud'] if gcloud_sdk_dir.stat.exists else []))
         | unique | list }}
  vars:
    _selected: "{{ selected_capabilities | default([]) }}"

- name: Derive the role interface from capabilities
  ansible.builtin.set_fact:
    # Optional packages come from the SELECTED capabilities (install what you
    # picked); config deploys come from the ACTIVE set (also manage what's
    # already present). The engine hardcodes no package names or paths.
    homebrew_optional_formulae: >-
      {{ _selected_entries | selectattr('type', 'eq', 'formula')
         | map(attribute='packages') | map('split') | flatten | list }}
    homebrew_optional_casks: >-
      {{ _selected_entries | selectattr('type', 'eq', 'cask')
         | map(attribute='packages') | map('split') | flatten | list }}
    vscode_optional_extensions: >-
      {{ _selected_entries | selectattr('type', 'eq', 'vscode')
         | map(attribute='packages') | map('split') | flatten | list }}
    # Flattened list of config deploys ({src, dest, kind?}) from active caps.
    computer_setup_config_deploys: >-
      {{ _active_entries | selectattr('config', 'defined')
         | map(attribute='config') | flatten | list }}
    has_nvm: "{{ 'nvm' in _active }}"
    has_gcloud: "{{ 'gcloud' in _active }}"
    has_dbt: "{{ 'dbt' in _active }}"
    has_zed: "{{ 'zed' in _active }}"
    has_opencode: "{{ 'opencode' in _active }}"
    has_vscode: "{{ 'vscode' in _active }}"
  vars:
    _selected: "{{ selected_capabilities | default([]) }}"
    _active: "{{ computer_setup_active_capabilities }}"
    _selected_entries: >-
      {{ _selected | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry) | list }}
    _active_entries: >-
      {{ _active | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry) | list }}
