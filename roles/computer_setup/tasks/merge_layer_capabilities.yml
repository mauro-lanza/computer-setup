---
# Merge one layer's capabilities.yml into the registry, a dict keyed by
# capability id. Loop var: `_layer`. Layers run in ascending priority, so a
# higher-priority layer's entry for the same id wins outright.
#
# The registry is read by both bootstrap (to build the selection menu) and the
# engine (to derive packages and config), so no package name is ever hardcoded.

- name: "[{{ _layer.name }}] Stat capabilities.yml"
  ansible.builtin.stat:
    path: "{{ computer_setup_layer_cache }}/{{ _layer.name }}/capabilities.yml"
  register: _layer_capabilities_stat

- name: "[{{ _layer.name }}] Load capabilities.yml"
  ansible.builtin.include_vars:
    file: "{{ computer_setup_layer_cache }}/{{ _layer.name }}/capabilities.yml"
    name: _incoming_capabilities
  when: _layer_capabilities_stat.stat.exists

# A bare `capabilities:` key parses to None, not a missing key, so `default([])`
# does not fire and the play aborts on an unattributed Jinja error — inside
# pre_tasks, which every entry point runs. Fail here naming the layer instead.
- name: "[{{ _layer.name }}] Assert capabilities.yml declares a list"
  ansible.builtin.assert:
    that:
      - _incoming_capabilities.capabilities is not string
      - _incoming_capabilities.capabilities is not mapping
      - (_incoming_capabilities.capabilities | default([], true)) is sequence
    fail_msg: >-
      Layer '{{ _layer.name }}' has a malformed capabilities.yml: the top-level
      `capabilities` key must be a list of capability entries (or the file must
      omit the key entirely). Got:
      {{ _incoming_capabilities.capabilities | default(None, true) | type_debug }}.
    quiet: true
  when: _layer_capabilities_stat.stat.exists

- name: "[{{ _layer.name }}] Merge capability entries into the registry"
  ansible.builtin.set_fact:
    computer_setup_capability_registry: >-
      {{ computer_setup_capability_registry
         | combine(dict((_caps | map(attribute='id')) | zip(_caps))) }}
  vars:
    # `default([], true)` (not `default([])`) so an explicit null is replaced too.
    _caps: "{{ _incoming_capabilities.capabilities | default([], true) }}"
  when: _layer_capabilities_stat.stat.exists
