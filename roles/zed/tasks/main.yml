---
- name: Ensure Zed config directory exists
  ansible.builtin.file:
    path: "{{ zed_config_dir }}"
    state: directory
    mode: "0755"

- name: Resolve Zed settings
  ansible.builtin.include_role:
    name: computer_setup
    tasks_from: resolve_layer_file
  vars:
    computer_setup_lookup_key: zed/settings.json
    computer_setup_lookup_result_var: zed_settings_src
    computer_setup_lookup_fallback_dir: "{{ role_path }}/files"

- name: Deploy Zed settings
  ansible.builtin.copy:
    src: "{{ zed_settings_src }}"
    dest: "{{ zed_config_dir }}/settings.json"
    mode: "0644"
  when: zed_settings_src | default('') | length > 0
