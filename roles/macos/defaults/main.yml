---
# Applies whatever `defaults` a layer declares. Empty here so the orchestrator
# changes no system setting on its own.
#
# Item schema: { domain, key, type, value, notify? }. Use
# `notify: Restart Dock and Finder` for entries affecting Dock/Finder UI.
macos_defaults: []

# Applied only when Rectangle is installed (gated in tasks/main.yml).
macos_rectangle_defaults: []

# Read-only helper that diffs live defaults against the declared values and
# emits paste-ready YAML.
macos_capture_bin_dir: "{{ home_dir }}/.local/bin"
macos_capture_path: "{{ macos_capture_bin_dir }}/macos-capture"
