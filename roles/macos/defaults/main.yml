---
# Item schema: { domain, key, type, value, host?, notify? }. Empty so the
# orchestrator changes no setting itself; `notify: Restart Dock and Finder` for Dock/Finder entries.
macos_defaults: []

# Applied only when the app exists. Item schema: { app: <path>, defaults: [ {domain, key, type, value, notify?} ] }
macos_conditional_defaults: []

# Read-only helper that diffs live defaults against declared values and emits paste-ready YAML.
macos_capture_path: "{{ computer_setup_bin_dir }}/macos-capture"
