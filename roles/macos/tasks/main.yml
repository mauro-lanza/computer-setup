---
# Failures are collected and reported from local.yml post_tasks, not here; see
# "Partial failures are reported at the end of the play" in docs/findings.md.
#
# `host: currentHost` on an entry targets per-machine ByHost preferences (menu
# bar / Control Center visibility, screensaver) that a plain `defaults read`
# does not show.
# App-conditional defaults; app paths are layer data.
- name: Check which conditional-defaults apps are installed
  ansible.builtin.stat:
    path: "{{ item.app }}"
  loop: "{{ macos_conditional_defaults }}"
  loop_control:
    label: "{{ item.app | basename }}"
  register: macos_conditional_app_stat

- name: Apply macOS system defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    host: "{{ item.host | default(omit) }}"
    state: present
  loop: >-
    {{ macos_defaults
       + (macos_conditional_app_stat.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | subelements('defaults', skip_missing=True)
          | map('last') | list) }}
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  notify: "{{ item.notify | default([], true) }}"
  register: macos_defaults_results
  ignore_errors: true

# macos-capture: a read-only helper to diff this machine's live defaults against
# the values declared above and emit paste-ready YAML (closes the IaC loop).
- name: Ensure ~/.local/bin exists (for macos-capture)
  ansible.builtin.file:
    path: "{{ computer_setup_bin_dir }}"
    state: directory
    mode: "0755"

- name: Deploy macos-capture helper
  ansible.builtin.template:
    src: macos-capture.sh.j2
    dest: "{{ macos_capture_path }}"
    mode: "0755"
