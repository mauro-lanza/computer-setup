---
- name: Apply macOS system defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  notify: "{{ item.notify | default([], true) }}"

# App-conditional defaults. The app paths are layer data: the engine names no
# application, so window managers other than Rectangle need no engine change.
- name: Check which conditional-defaults apps are installed
  ansible.builtin.stat:
    path: "{{ item.app }}"
  loop: "{{ macos_conditional_defaults | default([]) }}"
  loop_control:
    label: "{{ item.app | basename }}"
  register: macos_conditional_app_stat

- name: Apply defaults for installed apps
  community.general.osx_defaults:
    domain: "{{ item.1.domain }}"
    key: "{{ item.1.key }}"
    type: "{{ item.1.type }}"
    value: "{{ item.1.value }}"
    state: present
  loop: >-
    {{ macos_conditional_app_stat.results | default([])
       | selectattr('stat.exists')
       | map(attribute='item')
       | subelements('defaults', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.app | basename }}: {{ item.1.domain }} {{ item.1.key }}"
  notify: "{{ item.1.notify | default([], true) }}"

# macos-capture: a read-only helper to diff this machine's live defaults against
# the values declared above and emit paste-ready YAML (closes the IaC loop).
- name: Ensure ~/.local/bin exists (for macos-capture)
  ansible.builtin.file:
    path: "{{ macos_capture_bin_dir }}"
    state: directory
    mode: "0755"

- name: Deploy macos-capture helper
  ansible.builtin.template:
    src: macos-capture.sh.j2
    dest: "{{ macos_capture_path }}"
    mode: "0755"
