---
# One bad default must not abort the play. `osx_defaults` refuses to change a
# key's TYPE, so a single wrong `type:` in layer data is a hard failure — and
# this role runs before `runtimes` and `drift_correction`. On the first real
# fresh-machine bootstrap that is exactly what happened: a trackpad setting
# declared `bool` where macOS stores `int` aborted the run, and the machine got
# no version managers and no scheduled agents because of a tap-to-click
# preference.
#
# Failures are collected here and reported by a post_task in local.yml — NOT at
# the end of this role, which would still abort before `runtimes` and
# `drift_correction`. The whole point is that every role gets to run first.
- name: Apply macOS system defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  notify: "{{ item.notify | default([], true) }}"
  register: macos_defaults_results
  ignore_errors: true

# App-conditional defaults. The app paths are layer data: the engine names no
# application, so window managers other than Rectangle need no engine change.
- name: Check which conditional-defaults apps are installed
  ansible.builtin.stat:
    path: "{{ item.app }}"
  loop: "{{ macos_conditional_defaults | default([]) }}"
  loop_control:
    label: "{{ item.app | basename }}"
  register: macos_conditional_app_stat

- name: Apply defaults for installed apps
  community.general.osx_defaults:
    domain: "{{ item.1.domain }}"
    key: "{{ item.1.key }}"
    type: "{{ item.1.type }}"
    value: "{{ item.1.value }}"
    state: present
  loop: >-
    {{ macos_conditional_app_stat.results | default([])
       | selectattr('stat.exists')
       | map(attribute='item')
       | subelements('defaults', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.app | basename }}: {{ item.1.domain }} {{ item.1.key }}"
  notify: "{{ item.1.notify | default([], true) }}"

# macos-capture: a read-only helper to diff this machine's live defaults against
# the values declared above and emit paste-ready YAML (closes the IaC loop).
- name: Ensure ~/.local/bin exists (for macos-capture)
  ansible.builtin.file:
    path: "{{ computer_setup_bin_dir }}"
    state: directory
    mode: "0755"

- name: Deploy macos-capture helper
  ansible.builtin.template:
    src: macos-capture.sh.j2
    dest: "{{ macos_capture_path }}"
    mode: "0755"
