---
# Whether to run `brew update` before installing formulae.
# Set to false (e.g. via -e homebrew_update=false) to skip on re-runs.
homebrew_update: true

# Safe empty defaults — the real baseline is layer content (list-append):
#   homebrew_baseline_formulae — formulae always installed
#   homebrew_baseline_casks    — casks always installed
#   homebrew_adopt_casks       — casks safe to `--adopt` when already present.
#                                Not every cask is: see "Casks with protected
#                                payloads" in docs/findings.md.
#
# Engine prerequisites (git, gh, yq, ansible) are installed by bootstrap.sh in
# Phase 0, before any layer is cloned — they are not listed here.
homebrew_baseline_formulae: []
homebrew_baseline_casks: []
homebrew_adopt_casks: []

# Optional formulae/casks are resolved from ~/.config/computer-setup/prefs.yml
# in local.yml pre_tasks (which keeps the prefs file format short).
homebrew_optional_formulae: []
homebrew_optional_casks: []
