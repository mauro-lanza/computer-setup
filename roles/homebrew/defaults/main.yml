---
# Layer content (list-append) supplies the baseline; empty here.
#   homebrew_baseline_formulae — formulae always installed
#   homebrew_baseline_casks    — casks always installed
#   homebrew_adopt_casks       — casks safe to `--adopt`; see "Casks with protected payloads" in docs/findings.md
homebrew_baseline_formulae: []
homebrew_baseline_casks: []
homebrew_adopt_casks: []

# Skip `brew update` on re-runs with -e homebrew_update=false.
homebrew_update: true

# `homebrew_optional_*` are derived by core from selected capabilities (including their `tap:` field).
homebrew_baseline_taps: []
homebrew_optional_taps: []
homebrew_optional_formulae: []
homebrew_optional_casks: []

# What the homebrew and upgrade roles both act on.
homebrew_managed_taps: "{{ (homebrew_baseline_taps + homebrew_optional_taps) | unique | list }}"
homebrew_managed_formulae: "{{ homebrew_baseline_formulae + homebrew_optional_formulae }}"
homebrew_managed_casks: "{{ homebrew_baseline_casks + homebrew_optional_casks }}"
