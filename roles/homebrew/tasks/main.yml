---
# Partition casks once: the adopt allow-list (safe to --adopt when already in
# /Applications but unmanaged) vs. everything else (fresh install). Computing
# these up front keeps the install tasks readable and avoids repeating the
# select/reject expression in both `name:` and `when:`.
- name: Compute cask install sets
  ansible.builtin.set_fact:
    homebrew_casks_adopt: >-
      {{ (homebrew_mandatory_casks + homebrew_optional_casks)
         | select('in', homebrew_adopt_casks) | list }}
    homebrew_casks_fresh: >-
      {{ (homebrew_mandatory_casks + homebrew_optional_casks)
         | reject('in', homebrew_adopt_casks) | list }}

- name: Install formulae (and refresh Homebrew first)
  community.general.homebrew:
    name: "{{ homebrew_mandatory_formulae + homebrew_optional_formulae }}"
    state: present
    update_homebrew: "{{ homebrew_update }}"

- name: Install explicitly adoptable casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks_adopt }}"
    state: present
    install_options: adopt
  when: homebrew_casks_adopt | length > 0

- name: Install casks without adoption
  community.general.homebrew_cask:
    name: "{{ homebrew_casks_fresh }}"
    state: present
  when: homebrew_casks_fresh | length > 0
