---
# Taps FIRST. A package named `owner/tap/formula` cannot be resolved until its
# tap is added — `brew install anomalyco/tap/opencode` fails outright with
# "No available formula or cask with the name". This is invisible on a machine
# where the tap was once added by hand, which is exactly how it survived until a
# real fresh Mac hit it.
- name: Ensure required Homebrew taps
  community.general.homebrew_tap:
    name: "{{ (homebrew_baseline_taps + homebrew_optional_taps) | unique }}"
    state: present
  when: (homebrew_baseline_taps + homebrew_optional_taps) | length > 0

# Partition once: the adopt allow-list (safe to --adopt when already present in
# /Applications but unmanaged) vs. everything else.
- name: Compute cask install sets
  ansible.builtin.set_fact:
    homebrew_casks_adopt: >-
      {{ (homebrew_baseline_casks + homebrew_optional_casks)
         | select('in', homebrew_adopt_casks) | list }}
    homebrew_casks_fresh: >-
      {{ (homebrew_baseline_casks + homebrew_optional_casks)
         | reject('in', homebrew_adopt_casks) | list }}

- name: Install formulae (and refresh Homebrew first)
  community.general.homebrew:
    name: "{{ homebrew_baseline_formulae + homebrew_optional_formulae }}"
    state: present
    # Never refresh under --check: the module short-circuits there and never
    # reaches the install step, so the dry-run reports "Homebrew would be
    # updated" and names zero packages. `state: present` never upgrades, so the
    # refresh cannot affect a check run's outcome anyway.
    update_homebrew: "{{ homebrew_update | bool and not ansible_check_mode }}"

# Casks are installed ONE AT A TIME, with failures collected rather than fatal —
# the same reasoning the upgrade role already applied to cask upgrades, which
# was never carried over to installs. A single list meant the first bad cask
# aborted the play, and homebrew runs before runtimes and drift_correction: a
# fresh machine lost its version managers and scheduled agents because Docker
# Desktop could not symlink a credential helper.
#
# `sudo_password` is the documented fix for casks that need root (see "sudo
# inside an Ansible task has no controlling terminal" in docs/findings.md).
# Given a password the module writes a 0700 askpass script so Homebrew can use
# `sudo -A`. Supplied through the environment, never `-e`, which would expose it
# in the process list. Omitted when unset, so nothing changes for scheduled runs.
- name: Install explicitly adoptable casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    install_options: adopt
    sudo_password: "{{ lookup('env', 'CS_SUDO_PASSWORD') | default(omit, true) }}"
  loop: "{{ homebrew_casks_adopt }}"
  loop_control:
    label: "{{ item }}"
  register: homebrew_adopt_results
  ignore_errors: true
  when: homebrew_casks_adopt | length > 0

- name: Install casks without adoption
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    sudo_password: "{{ lookup('env', 'CS_SUDO_PASSWORD') | default(omit, true) }}"
  loop: "{{ homebrew_casks_fresh }}"
  loop_control:
    label: "{{ item }}"
  register: homebrew_fresh_results
  ignore_errors: true
  when: homebrew_casks_fresh | length > 0
