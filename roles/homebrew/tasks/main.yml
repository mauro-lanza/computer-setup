---
# Taps first: `owner/tap/formula` cannot resolve until its tap is added.
- name: Ensure required Homebrew taps
  community.general.homebrew_tap:
    name: "{{ homebrew_managed_taps }}"
    state: present
  when: homebrew_managed_taps | length > 0

- name: Install formulae (and refresh Homebrew first)
  community.general.homebrew:
    name: "{{ homebrew_managed_formulae }}"
    state: present
    # No refresh under --check: the module then never reaches the install step and names zero packages.
    update_homebrew: "{{ homebrew_update | bool and not ansible_check_mode }}"

# One cask at a time, failures collected and reported from local.yml post_tasks
# (see "Partial failures are reported at the end of the play" in docs/findings.md).
#
# `sudo_password` (env, never `-e`) lets the module write a 0700 askpass script
# for `sudo -A`; see "sudo inside an Ansible task has no controlling terminal" in
# docs/findings.md. Omitted when unset.
- name: Install casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    install_options: "{{ 'adopt' if item in homebrew_adopt_casks else omit }}"
    sudo_password: "{{ lookup('env', 'CS_SUDO_PASSWORD') | default(omit, true) }}"
  loop: "{{ homebrew_managed_casks }}"
  loop_control:
    label: "{{ item }}"
  register: homebrew_cask_results
  ignore_errors: true
