---
# Partition casks once: the adopt allow-list (safe to --adopt when already in
# /Applications but unmanaged) vs. everything else (fresh install). Computing
# these up front keeps the install tasks readable and avoids repeating the
# select/reject expression in both `name:` and `when:`.
- name: Compute cask install sets
  ansible.builtin.set_fact:
    homebrew_casks_adopt: >-
      {{ (homebrew_baseline_casks + homebrew_optional_casks)
         | select('in', homebrew_adopt_casks) | list }}
    homebrew_casks_fresh: >-
      {{ (homebrew_baseline_casks + homebrew_optional_casks)
         | reject('in', homebrew_adopt_casks) | list }}

- name: Install formulae (and refresh Homebrew first)
  community.general.homebrew:
    name: "{{ homebrew_baseline_formulae + homebrew_optional_formulae }}"
    state: present
    # Never refresh the index under --check. The module's _update_homebrew()
    # short-circuits in check mode: it sets changed=True, raises, and run()
    # swallows the exception — so _install_packages() is NEVER REACHED and the
    # task reports a bare "Homebrew would be updated." with zero packages
    # evaluated. That makes the dry-run useless precisely where it matters most:
    # bootstrap.sh offers "Preview changes first (dry-run)?" on a fresh machine,
    # and the preview could not name a single formula it was about to install.
    # `state: present` never upgrades anything, so refreshing the index has no
    # effect on the outcome of a check run anyway.
    update_homebrew: "{{ homebrew_update | bool and not ansible_check_mode }}"

- name: Install explicitly adoptable casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks_adopt }}"
    state: present
    install_options: adopt
  when: homebrew_casks_adopt | length > 0

- name: Install casks without adoption
  community.general.homebrew_cask:
    name: "{{ homebrew_casks_fresh }}"
    state: present
  when: homebrew_casks_fresh | length > 0
