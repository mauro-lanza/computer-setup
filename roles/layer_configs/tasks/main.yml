---
# Generic config manager: deploy each config entry contributed by an active
# capability (computer_setup_config_deploys, derived by the computer_setup role
# from the selected capabilities' `config:` bundles) via the deploy_layer_file
# primitive. Highest-priority layer wins the source file; no-op when unprovided.
#
# The list is data: capabilities declare their config in a plugin capability, so
# adding a config-only tool needs no engine change.
- name: Deploy capability config files
  ansible.builtin.include_role:
    name: computer_setup
    tasks_from: deploy_layer_file
  vars:
    computer_setup_lookup_key: "{{ item.src }}"
    computer_setup_deploy_dest: "{{ item.dest }}"
    computer_setup_deploy_kind: "{{ item.kind | default('file') }}"
    computer_setup_lookup_fallback_dir: "{{ item.fallback_dir | default(role_path ~ '/files') }}"
  loop: "{{ computer_setup_config_deploys | default([]) }}"
  loop_control:
    label: "{{ item.dest | basename }}"
