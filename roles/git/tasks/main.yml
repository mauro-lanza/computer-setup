---
- name: Detect VS Code binary (for git editor)
  ansible.builtin.stat:
    path: "{{ vscode_code_binary }}"
  register: git_code_stat

- name: Resolve git editor
  ansible.builtin.set_fact:
    git_editor_resolved: >-
      {{ git_editor if git_editor | length > 0
         else ('code --wait' if git_code_stat.stat.exists else 'vim') }}

- name: Deploy global .gitignore file
  ansible.builtin.copy:
    content: |
      # Managed by ansible — do not edit manually
      {% for entry in git_global_gitignore_entries %}
      {{ entry }}
      {% endfor %}
    dest: "{{ home_dir }}/.gitignore_global"
    mode: "0644"
    # Same hazard as ~/.gitconfig below, and it was the only one of the pair
    # without the guard. The default for git_global_gitignore_entries is [] —
    # the state when running standalone, or with layers that do not set the key
    # — so this task will happily truncate a restored ~/.gitignore_global down
    # to a single comment line. gitconfig.j2 then points core.excludesFile at
    # the file that was just emptied.
    backup: true
  when: git_global_gitignore_entries | default([], true) | length > 0

# Refuse to point git at an exclude file this role did not populate. Writing a
# one-line stub and wiring core.excludesFile to it is worse than leaving both
# alone: it silently disables whatever global ignores the user had.
- name: Warn that no global gitignore entries are declared
  ansible.builtin.debug:
    msg: >-
      No `git_global_gitignore_entries` declared by any active layer —
      leaving {{ home_dir }}/.gitignore_global untouched.
  when: git_global_gitignore_entries | default([], true) | length == 0

- name: Deploy managed ~/.gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ home_dir }}/.gitconfig"
    mode: "0644"
    # This template renders ONLY git_config_sections from the layers, so a
    # pre-existing ~/.gitconfig (credential.helper, user.signingkey, gpg.format,
    # includeIf blocks for work repos) is replaced wholesale. On a migrated
    # machine that happens before the user could move any of it into a layer.
    backup: true
