---
- name: Deploy global .gitignore file
  ansible.builtin.copy:
    content: |
      # Managed by ansible — do not edit manually
      {% for entry in git_global_gitignore_entries %}
      {{ entry }}
      {% endfor %}
    dest: "{{ home_dir }}/.gitignore_global"
    mode: "0644"
    # The entries default to [], so without the `when` below this truncates a
    # restored ~/.gitignore_global to one comment line — and gitconfig.j2 then
    # points core.excludesFile at the file just emptied.
    backup: true
  when: git_global_gitignore_entries | default([], true) | length > 0

# Refuse to point git at an exclude file this role did not populate. Writing a
# one-line stub and wiring core.excludesFile to it is worse than leaving both
# alone: it silently disables whatever global ignores the user had.
- name: Warn that no global gitignore entries are declared
  ansible.builtin.debug:
    msg: >-
      No `git_global_gitignore_entries` declared by any active layer —
      leaving {{ home_dir }}/.gitignore_global untouched.
  when: git_global_gitignore_entries | default([], true) | length == 0

# ─── Managed git config (included, not imposed) ──────────────────────────────
# This role owns git_managed_config_path completely and touches ~/.gitconfig
# only to add one `include.path`. Never replace ~/.gitconfig wholesale: it
# carries the user's signing key, credential helper and includeIf rules.

- name: Ensure the managed git config directory exists
  ansible.builtin.file:
    path: "{{ git_managed_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy the managed git config
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ git_managed_config_path }}"
    mode: "0644"

- name: Deploy per-directory identity files
  ansible.builtin.template:
    src: identity.gitconfig.j2
    dest: "{{ git_managed_config_dir }}/identity-{{ identity.condition | hash('md5') }}.gitconfig"
    mode: "0644"
  loop: "{{ git_conditional_identities | default([], true) }}"
  loop_control:
    loop_var: identity
    label: "{{ identity.condition }}"

# Reconcile: an identity removed from the layers must stop applying. Only files
# this role's naming scheme produces are considered, so nothing else in
# ~/.config/git is ever removed.
- name: Find previously deployed identity files
  ansible.builtin.find:
    paths: "{{ git_managed_config_dir }}"
    patterns: "identity-*.gitconfig"
    file_type: file
  register: git_identity_found

- name: Remove identity files no longer declared
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (git_identity_found.files | default([]) | map(attribute='path') | list)
       | difference(git_conditional_identities | default([], true)
                    | map(attribute='condition') | map('hash', 'md5')
                    | map('regex_replace', '^(.*)$',
                          git_managed_config_dir ~ '/identity-\1.gitconfig') | list) }}
  loop_control:
    label: "{{ item | basename }}"

- name: Include the managed config from ~/.gitconfig
  # Appended, so managed values are read LAST and still win. git_config drives
  # git itself, so the file stays valid whatever formatting it already had.
  community.general.git_config:
    name: include.path
    scope: global
    value: "{{ git_managed_config_path }}"
