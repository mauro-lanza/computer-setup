---
# `git_editor` is normally supplied by the `editor` question's chosen option
# (see questions.yml in a layer), so the shell and git agree on one answer. A
# layer may still set it directly, and an empty value means "leave core.editor
# unset and let $EDITOR/$VISUAL decide" — which is a legitimate choice, not a
# missing one. The engine no longer probes for a specific editor binary.
- name: Resolve git editor
  ansible.builtin.set_fact:
    git_editor_resolved: "{{ git_editor | default('', true) }}"

- name: Deploy global .gitignore file
  ansible.builtin.copy:
    content: |
      # Managed by ansible — do not edit manually
      {% for entry in git_global_gitignore_entries %}
      {{ entry }}
      {% endfor %}
    dest: "{{ home_dir }}/.gitignore_global"
    mode: "0644"
    # The entries default to [], so without the `when` below this truncates a
    # restored ~/.gitignore_global to one comment line — and gitconfig.j2 then
    # points core.excludesFile at the file just emptied.
    backup: true
  when: git_global_gitignore_entries | default([], true) | length > 0

# Refuse to point git at an exclude file this role did not populate. Writing a
# one-line stub and wiring core.excludesFile to it is worse than leaving both
# alone: it silently disables whatever global ignores the user had.
- name: Warn that no global gitignore entries are declared
  ansible.builtin.debug:
    msg: >-
      No `git_global_gitignore_entries` declared by any active layer —
      leaving {{ home_dir }}/.gitignore_global untouched.
  when: git_global_gitignore_entries | default([], true) | length == 0

- name: Deploy managed ~/.gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ home_dir }}/.gitconfig"
    mode: "0644"
    # Renders only git_config_sections, so a pre-existing ~/.gitconfig
    # (signing keys, credential helper, includeIf blocks) is replaced wholesale.
    backup: true
