---
git_user_name: ""
git_user_email: ""
# Editor command written to core.editor. Normally supplied by the `editor`
# question's chosen option. Empty = do not write core.editor at all, so git
# falls back to $VISUAL/$EDITOR (and then to its own default).
git_editor: ""

# Everything below is layer-supplied. Empty defaults keep the orchestrator's own
# ~/.gitconfig minimal and opinion-free.

# Default branch for `git init` (rendered only when set).
git_default_branch: ""

# Extra config rendered into ~/.gitconfig, grouped by section (dict — merges
# recursively across layers). The gitconfig.j2 template renders it generically.
git_config_sections: {}

# Entries written to ~/.gitignore_global (list — appends across layers).
git_global_gitignore_entries: []
