---
git_user_name: ""
git_user_email: ""
# Editor command written to core.editor. Normally supplied by the `editor`
# question's chosen option. Empty = do not write core.editor at all, so git
# falls back to $VISUAL/$EDITOR (and then to its own default).
git_editor: ""

# Everything below is layer-supplied. Empty defaults keep the orchestrator's own
# ~/.gitconfig minimal and opinion-free.

# Default branch for `git init` (rendered only when set).
git_default_branch: ""

# Extra config rendered into ~/.gitconfig, grouped by section (dict — merges
# recursively across layers). The gitconfig.j2 template renders it generically.
git_config_sections: {}

# Entries written to the global gitignore (list — appends across layers).
git_global_gitignore_entries: []

# ─── Where the managed config lives ──────────────────────────────────────────
# This role owns git_managed_config_path completely and reaches ~/.gitconfig only
# to append one `include.path`. See "git config is included, not imposed" in
# docs/operations.md.
git_managed_config_dir: "{{ home_dir }}/.config/git"
git_managed_config_path: "{{ git_managed_config_dir }}/computer-setup.gitconfig"
# git's own XDG location for the global ignore file. `core.excludesFile` is
# still written explicitly rather than relying on git reading this path by
# default, because git only falls back to it when core.excludesFile is UNSET —
# and this role must not claim a file it did not populate.
git_global_gitignore_path: "{{ git_managed_config_dir }}/ignore"

# Per-directory identities, rendered as `includeIf` blocks — how a work layer
# supplies a work address without touching the machine-wide identity.
#
# Item schema: { condition: <git includeIf condition>, email:, name?: }
#   name       defaults to the global git_user_name
#   condition  passed to git verbatim; both `gitdir:` and `hasconfig:` forms
#              work, with a symlink caveat on `gitdir:` — see
#              "Per-directory identities" in docs/operations.md.
git_conditional_identities: []
