---
git_user_name: ""
git_user_email: ""
# Editor command written to core.editor. Normally supplied by the `editor`
# question's chosen option. Empty = do not write core.editor at all, so git
# falls back to $VISUAL/$EDITOR (and then to its own default).
git_editor: ""

# Everything below is layer-supplied. Empty defaults keep the orchestrator's own
# ~/.gitconfig minimal and opinion-free.

# Default branch for `git init` (rendered only when set).
git_default_branch: ""

# Extra config rendered into ~/.gitconfig, grouped by section (dict — merges
# recursively across layers). The gitconfig.j2 template renders it generically.
git_config_sections: {}

# Entries written to ~/.gitignore_global (list — appends across layers).
git_global_gitignore_entries: []

# ─── Where the managed config lives ──────────────────────────────────────────
# This role owns ONE file completely, and reaches ~/.gitconfig only to add a
# single `include.path` pointing at it. Never replace ~/.gitconfig wholesale:
# it carries the user's signing key, credential helper and includeIf rules.
#
# The include is appended, so git reads the managed values LAST and they still
# win over anything earlier in ~/.gitconfig — full enforcement, no collateral
# damage.
git_managed_config_dir: "{{ home_dir }}/.config/git"
git_managed_config_path: "{{ git_managed_config_dir }}/computer-setup.gitconfig"

# Per-directory identities, rendered as `includeIf gitdir:` blocks. This is what
# makes the work/personal layer split actually work: git_user_name/email are
# machine-local prefs (reserved from layers), so a work layer had no way to say
# "use my work address under this directory".
#
# Item schema: { condition: <git includeIf condition>, email:, name?: }
# `name` defaults to the global git_user_name.
#
# `condition` is passed to git verbatim, so both forms work:
#
#   condition: "gitdir:~/Projects/work/"
#       Matches by location. Git resolves symlinks first, so the pattern must be
#       the REAL path (/private/tmp/... on macOS, not /tmp/...).
#
#   condition: "hasconfig:remote.*.url:git@github.com:acme/**"
#       Matches by remote URL (git >= 2.36). Layout-independent, so work and
#       personal checkouts can share one directory — which is what makes this
#       usable without relocating existing clones.
git_conditional_identities: []
