---
# This role declares NO aliases for the play vars its templates render — the
# templates reference those directly. An alias a layer can never override (the
# `drift_correction_` prefix is reserved) is pure indirection.
#
# The knobs below are real: they have their own defaults, and the machine-tier
# ones (enabled, schedule hours) are answerable via questions.
#
# Whether the two scheduled LaunchAgents are installed at all. The
# `computer-setup` command is deployed either way, so turning this off keeps the
# tooling and drops only the unattended jobs. Normally answered by the
# `drift-agents` question; defaults to on so an existing machine keeps its.
drift_correction_enabled: true
drift_correction_schedule_hour: 10
drift_correction_schedule_minute: 0
# Morning upgrade, ahead of the 10:00 drift check.
drift_correction_upgrade_schedule_hour: 9
drift_correction_upgrade_schedule_minute: 0
drift_correction_log_dir: "{{ home_dir }}/Library/Logs"

# Scheduled agents. Both run the same runner script with a different mode.
# Staggered so the upgrade finishes before the check reports on its results —
# otherwise a morning upgrade would look like drift for an hour.
drift_correction_agents:
  - label: com.computer-setup.upgrade
    mode: upgrade
    hour: "{{ drift_correction_upgrade_schedule_hour }}"
    minute: "{{ drift_correction_upgrade_schedule_minute }}"
  - label: com.computer-setup.check
    mode: check
    hour: "{{ drift_correction_schedule_hour }}"
    minute: "{{ drift_correction_schedule_minute }}"

# Maximum lines to retain in the rolling log file (per run, the wrapper trims).
drift_correction_log_max_lines: 5000

# Connectivity probe timeout (seconds). The runner probes the repo over SSH —
# the same transport the pull uses — so a blocked port 22 or an unavailable key
# is treated as "can't run now" (silent skip) rather than "config is broken".
drift_correction_connectivity_timeout: 5
