---
# Opt-in upgrade path, gated behind the `upgrade`/`never` tags in local.yml so
# the daily drift check and normal `drift-apply` never run it. Trigger with
# `drift-update`, which confirms in your terminal then runs this with
# `-e computer_setup_upgrade_assume_yes=true`.
#
# Without that flag this role only PREVIEWS, so a scheduled run can never
# upgrade. Confirmation lives in the shell function (a guaranteed TTY) rather
# than an in-play `pause`, which hangs forever under `ansible-pull` when stdin
# is not interactive.
#
# tfenv's Terraform is deliberately not upgraded — it is pinned by
# runtimes_tfenv_terraform_version, since an unplanned bump can break state.

- name: Refresh Homebrew package index
  ansible.builtin.command: brew update
  changed_when: false

# With no package arguments `brew outdated` reports every outdated package on the
# machine, managed or not. Skip rather than preview packages we do not manage.
- name: Determine which managed formulae are outdated
  ansible.builtin.command:
    argv: "{{ ['brew', 'outdated', '--formula', '--verbose'] + upgrade_managed_formulae }}"
  register: upgrade_outdated_formulae
  changed_when: false
  failed_when: false
  when: upgrade_managed_formulae | length > 0

- name: Determine which managed casks are outdated
  ansible.builtin.command:
    argv: "{{ ['brew', 'outdated', '--cask', '--verbose'] + upgrade_managed_casks }}"
  register: upgrade_outdated_casks
  changed_when: false
  failed_when: false
  when:
    - computer_setup_upgrade_include_casks | bool
    - upgrade_managed_casks | length > 0

- name: Show pending upgrades
  vars:
    # `brew outdated` exits 1 to mean "something IS outdated", like diff(1), so
    # rc is useless as an error signal. A real failure (unknown formula, missing
    # tap) also exits non-zero but writes "Error:" to stderr and nothing to
    # stdout — and `brew outdated` is all-or-nothing, so one bad name means
    # nothing was checked. Without this, empty stdout renders as "(up to date)".
    _formulae_error: "{{ 'Error:' in (upgrade_outdated_formulae.stderr | default('')) }}"
    _casks_error: "{{ 'Error:' in (upgrade_outdated_casks.stderr | default('')) }}"
  ansible.builtin.debug:
    msg: |-
      ── Pending upgrades (preview) ───────────────────────────────
      Homebrew formulae:
      {% if upgrade_managed_formulae | length == 0 %}
        (none managed)
      {% elif upgrade_outdated_formulae.skipped | default(false) %}
        (not checked — `brew outdated` cannot run under --check)
      {% elif _formulae_error | bool %}
        (CHECK FAILED — brew could not resolve the managed set, so NOTHING was
         verified. Usually an unknown/renamed formula or an uninstalled tap:)
      {{ upgrade_outdated_formulae.stderr | default('') | trim | indent(4, true) }}
      {% else %}
      {{ upgrade_outdated_formulae.stdout | default('') | trim or '  (up to date)' }}
      {% endif %}

      Homebrew casks:
      {% if not (computer_setup_upgrade_include_casks | bool) %}
        (skipped — computer_setup_upgrade_include_casks=false; run `drift-update` to include casks)
      {% elif upgrade_managed_casks | length == 0 %}
        (none managed)
      {% elif upgrade_outdated_casks.skipped | default(false) %}
        (not checked — `brew outdated` cannot run under --check)
      {% elif _casks_error | bool %}
        (CHECK FAILED — see the note above; nothing was verified. brew said:)
      {{ upgrade_outdated_casks.stderr | default('') | trim | indent(4, true) }}
      {% else %}
      {{ upgrade_outdated_casks.stdout | default('') | trim or '  (up to date)' }}
      {% endif %}
      {% if upgrade_casks_exclude | length > 0 %}
        excluded from upgrade: {{ upgrade_casks_exclude | join(', ') }}
      {% endif %}

      Also refreshed to latest on apply (not pre-diffable):
        Ansible Galaxy collections, Node.js {{ upgrade_nvm_node }}.
      ─────────────────────────────────────────────────────────────

- name: Apply the confirmed upgrades
  when:
    - computer_setup_upgrade_assume_yes | default(false) | bool
    - not ansible_check_mode
  block:
    - name: Upgrade managed Homebrew formulae to latest
      community.general.homebrew:
        name: "{{ upgrade_managed_formulae }}"
        state: latest
      when: upgrade_managed_formulae | length > 0

    # One cask at a time with ignore_errors: passing the whole list to a single
    # task meant the first broken cask aborted the Galaxy and Node upgrades that
    # follow. Failures are collected and reported together below.
    - name: Upgrade managed Homebrew casks to latest
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: latest
        greedy: "{{ upgrade_casks_greedy | bool }}"
        # Casks replacing root-owned files make Homebrew call sudo, which has no
        # terminal this deep inside Ansible. Given a password the module writes a
        # 0700 askpass script so Homebrew can use `sudo -A`. Passed through the
        # environment by `drift-update` (never `-e`, which the process list would
        # expose); omitted when unset, so scheduled runs are unaffected.
        sudo_password: "{{ lookup('env', 'CS_SUDO_PASSWORD') | default(omit, true) }}"
      loop: "{{ upgrade_managed_casks }}"
      loop_control:
        label: "{{ item }}"
      register: upgrade_cask_results
      ignore_errors: true
      when:
        - computer_setup_upgrade_include_casks | bool
        - upgrade_managed_casks | length > 0

    - name: Update Ansible Galaxy collections
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - install
          - -r
          - "{{ playbook_dir }}/requirements.yml"
          - --upgrade
      register: upgrade_galaxy
      changed_when: "'Installing' in upgrade_galaxy.stdout"

    - name: Check if nvm is installed (to upgrade Node)
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
      register: upgrade_nvm_script

    # Version spec is quoted: the default is `lts/*` and zsh's NOMATCH makes an
    # unmatched glob a fatal error before nvm is ever invoked.
    - name: Upgrade default Node.js to newest via nvm ({{ upgrade_nvm_node }})
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
        nvm install '{{ upgrade_nvm_node }}' --latest-npm
        nvm alias default '{{ upgrade_nvm_node }}'
      args:
        executable: /bin/zsh
      register: upgrade_nvm_result
      changed_when: "'Downloading and installing' in upgrade_nvm_result.stdout"
      when: upgrade_nvm_script.stat.exists

- name: Report casks that failed to upgrade
  ansible.builtin.fail:
    msg: |-
      {{ _failed | length }} cask(s) failed to upgrade; everything else completed.
      {% for f in _failed %}
        • {{ f.item }}: {{ (f.msg | default('')) | trim | truncate(200) }}
      {% endfor %}
      A cask that manages its own updates can leave Homebrew's record out of step
      with the app on disk, and a failed upgrade can roll back badly. To recover one:
        1. Quit the app.
        2. brew uninstall --cask --force <name>
        3. brew install --cask <name>
      If /Applications/<App>.app is left as an empty directory, remove it with
      `rmdir` before reinstalling.
  vars:
    _failed: >-
      {{ upgrade_cask_results.results | default([]) | selectattr('failed', 'defined')
         | selectattr('failed') | list }}
  when: _failed | length > 0

- name: Explain how to apply when not confirmed
  ansible.builtin.debug:
    msg: >-
      Preview only — no upgrades applied. Run `drift-update` to upgrade
      (it confirms in your terminal first), or pass `-e computer_setup_upgrade_assume_yes=true`
      to apply non-interactively.
  when: >-
    not (computer_setup_upgrade_assume_yes | default(false) | bool)
    or ansible_check_mode
