---
# Opt-in upgrade path, gated behind the `upgrade`/`never` tags in local.yml so
# the daily drift check and normal `computer-setup apply` never run it. Trigger with
# `computer-setup upgrade`, which confirms in your terminal then runs this with
# `-e computer_setup_upgrade_assume_yes=true`.
#
# Without that flag every step only PREVIEWS, so a scheduled run can never
# upgrade. Confirmation lives in the shell function (a guaranteed TTY) rather
# than an in-play `pause`, which hangs forever under `ansible-pull` when stdin
# is not interactive.
#
# tfenv's Terraform is deliberately not upgraded — it is pinned by
# runtimes_tfenv_terraform_version, since an unplanned bump can break state.

- name: Refresh the Ansible Galaxy collections
  when:
    - computer_setup_upgrade_assume_yes | bool
    - not ansible_check_mode
  block:
    # KEEP THIS FIRST. The package upgrades below run community.general modules,
    # and a collection too stale for the installed ansible-core makes those fail
    # before this repair can run — permanently, since nothing would reach it.
    # This step depends on no collection, so it always runs.
    #
    # `--upgrade` only when the running core differs from the one recorded in
    # upgrade_galaxy_core_marker; `--clear-response-cache` always.
    # See "The upgrade path" in docs/findings.md for why each of those is the
    # way it is — all three were failure loops that could not self-heal.
    - name: Read the ansible-core version the collections were resolved against
      ansible.builtin.slurp:
        src: "{{ upgrade_galaxy_core_marker }}"
      register: upgrade_galaxy_core_recorded
      # Absent on a first run, and after that only if someone deleted it.
      # Either way the comparison below treats it as "unknown" and re-resolves.
      failed_when: false

    - name: Update Ansible Galaxy collections
      ansible.builtin.command:
        argv: >-
          {{ [computer_setup_runtime_bin ~ '/ansible-galaxy', 'collection', 'install', '-r',
              playbook_dir ~ '/requirements.yml', '--clear-response-cache']
             + (['--upgrade'] if _core_changed | bool else []) }}
      vars:
        _recorded_core: >-
          {{ (upgrade_galaxy_core_recorded.content | b64decode | trim)
             if (upgrade_galaxy_core_recorded.content is defined) else '' }}
        _core_changed: "{{ _recorded_core != ansible_version.full }}"
      register: upgrade_galaxy
      changed_when: "'Installing' in upgrade_galaxy.stdout"

    - name: Ensure the state directory exists
      ansible.builtin.file:
        # The canonical var, NOT `upgrade_galaxy_core_marker | dirname`, even
        # though they resolve identically. Two roles declaring one directory
        # through two different expressions is how this ended up declared 0755
        # here and 0700 in drift_correction: the 09:00 upgrade set one mode and
        # the 10:00 check reported drift on it, every day, invisibly.
        # Same expression everywhere means a divergence is greppable.
        path: "{{ computer_setup_state_dir }}"
        state: directory
        mode: "0700"

    # Written unconditionally, and only after the install above succeeded: if it
    # failed, the marker keeps the old value so the next run retries with
    # --upgrade rather than assuming the repair happened.
    - name: Record the ansible-core version the collections are resolved against
      ansible.builtin.copy:
        content: "{{ ansible_version.full }}\n"
        dest: "{{ upgrade_galaxy_core_marker }}"
        mode: "0644"

# Each detected manager previews, then upgrades once confirmed.
- name: Upgrade managed packages
  ansible.builtin.include_role:
    name: packages
    tasks_from: upgrade

- name: Upgrade Node.js via nvm
  when:
    - computer_setup_upgrade_assume_yes | bool
    - not ansible_check_mode
    - upgrade_nvm_enabled | bool
  block:
    - name: Check if nvm is installed (to upgrade Node)
      ansible.builtin.stat:
        path: "{{ runtimes_nvm_script_path }}"
      register: upgrade_nvm_script

    # Quoted: `lts/*` is a glob to a shell (see findings.md).
    - name: Upgrade default Node.js to newest via nvm ({{ upgrade_nvm_node }})
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        source "{{ runtimes_nvm_script_path }}"
        nvm install '{{ upgrade_nvm_node }}' --latest-npm
        nvm alias default '{{ upgrade_nvm_node }}'
      args:
        executable: /bin/bash
      register: upgrade_nvm_result
      changed_when: "'Downloading and installing' in upgrade_nvm_result.stdout"
      when: upgrade_nvm_script.stat.exists

- name: Summarise the upgrade
  ansible.builtin.debug:
    msg: >-
      {{ 'Upgrades applied.' if _applied else _preview_note }}
      Also refreshed to latest on apply (not pre-diffable): Ansible Galaxy
      collections{{ ', Node.js ' ~ upgrade_nvm_node if upgrade_nvm_enabled | bool else '' }}.
  vars:
    _applied: "{{ (computer_setup_upgrade_assume_yes | bool) and not ansible_check_mode }}"
    _preview_note: >-
      Preview only — no upgrades applied. Run `computer-setup upgrade` to upgrade
      (it confirms in your terminal first), or pass
      `-e computer_setup_upgrade_assume_yes=true` to apply non-interactively.

- name: Report casks that failed to upgrade
  ansible.builtin.fail:
    msg: |-
      {{ _failed | length }} cask(s) failed to upgrade; everything else completed.
      {% for f in _failed %}
        • {{ f.item }}: {{ (f.msg | default('')) | trim | truncate(200) }}
      {% endfor %}
      A cask that manages its own updates can leave Homebrew's record out of step
      with the app on disk, and a failed upgrade can roll back badly. To recover one:
        1. Quit the app.
        2. brew uninstall --cask --force <name>
        3. brew install --cask <name>
      If /Applications/<App>.app is left as an empty directory, remove it with
      `rmdir` before reinstalling.
  vars:
    _failed: >-
      {{ packages_cask_upgrade_results.results | default([]) | selectattr('failed', 'defined')
         | selectattr('failed') | list }}
  when: _failed | length > 0
