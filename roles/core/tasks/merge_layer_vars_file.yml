---
# Merge one vars file of one layer. Loop vars: `_layer`, `_vars_file` (relative
# to the layer root). A missing file is skipped.

- name: "[{{ _layer.name }}] Stat {{ _vars_file }}"
  ansible.builtin.stat:
    path: "{{ computer_setup_layer_cache }}/{{ _layer.name }}/{{ _vars_file }}"
  register: _layer_vars_stat

- name: "[{{ _layer.name }}] Load {{ _vars_file }}"
  ansible.builtin.include_vars:
    file: "{{ computer_setup_layer_cache }}/{{ _layer.name }}/{{ _vars_file }}"
    name: _incoming_layer_vars
  when: _layer_vars_stat.stat.exists

- name: "[{{ _layer.name }}] Assert {{ _vars_file }} does not define reserved keys"
  ansible.builtin.assert:
    that:
      - (_incoming_layer_vars.keys() | intersect(computer_setup_reserved_layer_keys) | length) == 0
      - (_incoming_layer_vars.keys() | select('match', computer_setup_reserved_prefix_re) | list | length) == 0
    fail_msg: >-
      Layer '{{ _layer.name }}' ({{ _vars_file }}) defines reserved key(s):
      {{ ((_incoming_layer_vars.keys() | intersect(computer_setup_reserved_layer_keys))
          + (_incoming_layer_vars.keys() | select('match', computer_setup_reserved_prefix_re) | list)) | unique | join(', ') }}.
      These are machine-local settings (use {{ computer_setup_machine_file }}) or
      engine-owned vars (the
      {{ computer_setup_reserved_layer_prefixes | join('*, ') }}*
      namespaces) — not layer content.
    quiet: true
  when: _layer_vars_stat.stat.exists

- name: "[{{ _layer.name }}] Report scalar overrides (highest priority wins)"
  ansible.builtin.debug:
    msg: >-
      Layer '{{ _layer.name }}' overrides scalar '{{ item.key }}':
      '{{ computer_setup_merged_vars[item.key] }}' -> '{{ item.value }}'
  loop: "{{ (_incoming_layer_vars | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - _layer_vars_stat.stat.exists
    - item.key in computer_setup_merged_vars
    - item.value is string or item.value is number or item.value is boolean
    - computer_setup_merged_vars[item.key] != item.value

- name: "[{{ _layer.name }}] Merge {{ _vars_file }} (lists append, scalars override)"
  ansible.builtin.set_fact:
    computer_setup_merged_vars: >-
      {{ computer_setup_merged_vars
         | combine(_layer_vars_clean, recursive=true, list_merge='append_rp') }}
  vars:
    # Drop null-valued keys before merging. A bare `packages_baseline:`
    # means "nothing here" but parses to None, which is DEFINED — so the
    # consuming role's `| default([])` never fires and the None crashes
    # somewhere unrelated. Dropping the key lets the role's default apply.
    _layer_vars_clean: >-
      {{ (_incoming_layer_vars | default({}) | dict2items
          | rejectattr('value', 'none') | list | items2dict)
         if (_incoming_layer_vars | default({})) else {} }}
  when: _layer_vars_stat.stat.exists
