---
- name: Assert supported platform (macOS Apple Silicon, or Linux)
  ansible.builtin.assert:
    that:
      - (ansible_facts['system'] == 'Darwin' and ansible_facts['architecture'] == 'arm64')
        or ansible_facts['system'] == 'Linux'
    fail_msg: >-
      This playbook supports macOS on Apple Silicon (arm64) and Linux.
      Detected: {{ ansible_facts['system'] }} / {{ ansible_facts['architecture'] }}.
    success_msg: "Platform check passed: {{ ansible_facts['system'] }} {{ ansible_facts['architecture'] }}"

# Everything platform-specific comes from this one profile; see "Platforms and
# package managers" in docs/architecture.md.
- name: Load the platform profile
  ansible.builtin.include_vars:
    file: "platform/{{ ansible_facts['system'] }}.yml"

# Only the profile's candidates are probed; content for an absent manager is skipped.
- name: Probe for package managers
  ansible.builtin.stat:
    path: "{{ item.value }}"
  loop: "{{ _probes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _cs_manager_probe
  vars:
    # Overridable with -e (tests).
    _probes: "{{ computer_setup_package_manager_probes | default(computer_setup_platform.package_managers) }}"

- name: Resolve the package managers this machine has
  ansible.builtin.set_fact:
    computer_setup_package_managers: >-
      {{ _cs_manager_probe.results | selectattr('stat.exists')
         | map(attribute='item.key') | list }}

- name: Check if the machine declaration exists
  ansible.builtin.stat:
    path: "{{ computer_setup_machine_file }}"
  register: machine_file

# Unnamed, so `answers`, `selected_capabilities` and `layers` land in play scope
# when the playbook is run directly (every test entry point). Extra-vars from
# the runner outrank it. A malformed file aborts here.
- name: Read the machine declaration
  ansible.builtin.include_vars:
    file: "{{ computer_setup_machine_file }}"
  when: machine_file.stat.exists

- name: Seed the accumulated layer vars
  ansible.builtin.set_fact:
    computer_setup_merged_vars: {}
    computer_setup_active_layers: []
    computer_setup_capability_registry: {}
    computer_setup_question_registry: {}
    # Namespaces a layer's vars.yml may never touch; by prefix so new engine vars are covered.
    computer_setup_reserved_layer_prefixes:
      - computer_setup_
      - drift_correction_
      - ansible_
      # deploy_layer_file's scratch facts
      - _cs_
    # Keys a question may set but a layer var may not; see "The machine tier" in docs/architecture.md.
    computer_setup_machine_tier_keys:
      - repositories_base_dir
      - drift_correction_enabled
      - drift_correction_schedule_hour
      - drift_correction_upgrade_schedule_hour
      - git_user_name
      - git_user_email
    # Public-interface names only (machine.yml keys, machine tier, play vars layers template against); engine-owned vars are covered by the prefixes.
    computer_setup_reserved_layer_keys:
      - selected_capabilities
      - answers
      - layers
      - git_user_name
      - git_user_email
      - home_dir
      - homebrew_prefix
      - repositories_base_dir

- name: Build the reserved-prefix pattern
  ansible.builtin.set_fact:
    computer_setup_reserved_prefix_re: "^({{ computer_setup_reserved_layer_prefixes | join('|') }})"

- name: Load and merge content layers
  when: machine_file.stat.exists
  block:
    - name: Resolve active layers (ascending priority — highest wins last)
      ansible.builtin.set_fact:
        computer_setup_active_layers: >-
          {{ (layers | default([], true))
             | sort(attribute='priority') }}

    # ─── Questions and answers ────────────────────────────────────────────────
    # Answers are applied twice, before and after the layer var merge; see
    # "Resolution order" in docs/architecture.md.
    - name: Merge each layer's questions.yml into the question registry
      ansible.builtin.include_tasks: merge_layer_questions.yml
      loop: "{{ computer_setup_active_layers }}"
      loop_control:
        loop_var: _layer
        label: "{{ _layer.name }}"

    - name: Resolve the answer to every registered question
      # Unanswered falls back to the declared default; answers to undeclared questions are dropped.
      ansible.builtin.set_fact:
        computer_setup_answers: "{{ _defaults | combine(_given_known) }}"
      vars:
        _reg: "{{ computer_setup_question_registry }}"
        _defaults: >-
          {{ dict(_reg.keys() | zip(_reg.values() | map(attribute='default', default=''))) }}
        _given_known: >-
          {{ (answers | default({}, true)) | dict2items
             | selectattr('key', 'in', _reg.keys() | list) | list | items2dict }}

    - name: Assert every select answer is one of its declared options
      ansible.builtin.assert:
        that:
          - computer_setup_answers[item.key] in (item.value.options | map(attribute='value') | list)
        fail_msg: >-
          Answer '{{ computer_setup_answers[item.key] }}' for question
          '{{ item.key }}' is not one of its options
          ({{ item.value.options | map(attribute='value') | join(', ') }}).
          Fix `answers.{{ item.key }}` in {{ computer_setup_machine_file }}, or re-run
          bootstrap.sh.
        quiet: true
      loop: >-
        {{ computer_setup_question_registry | dict2items
           | selectattr('value.type', 'eq', 'select') | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: Assert every answer satisfies its question's validate pattern
      # Bootstrap checks at the prompt; machine.yml and --answers files are not.
      ansible.builtin.assert:
        that:
          - computer_setup_answers[item.key] | string is match(item.value.validate)
        fail_msg: >-
          Answer '{{ computer_setup_answers[item.key] }}' for question
          '{{ item.key }}' does not match the pattern its layer declares
          ({{ item.value.validate }}).
          Fix `answers.{{ item.key }}` in {{ computer_setup_machine_file }}, or
          re-run bootstrap.sh.
        quiet: true
      loop: >-
        {{ computer_setup_question_registry | dict2items
           | selectattr('value.validate', 'defined') | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: Accumulate the answers' variable payloads
      # Two forms, both optional:
      #   question-level `set_var: <name>`  -> <name> = the raw answer
      #   option-level   `set: {k: v}`      -> literal vars, when that option is chosen
      ansible.builtin.set_fact:
        computer_setup_answer_vars: >-
          {{ (computer_setup_answer_vars | default({}))
             | combine(_from_question) | combine(_from_option) }}
      loop: "{{ computer_setup_question_registry | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        _a: "{{ computer_setup_answers[item.key] }}"
        _from_question: >-
          {{ {item.value.set_var: _a} if item.value.set_var is defined else {} }}
        _chosen: >-
          {{ (item.value.options | default([]) | selectattr('value', 'eq', _a) | list) }}
        _from_option: >-
          {{ (_chosen | first).set | default({}) if _chosen | length > 0 else {} }}

    - name: Expose the answers' variable payloads as play scope
      # First application, before the layer var merge; re-applied after it.
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_answer_vars | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Merge each layer's vars.yml
      ansible.builtin.include_tasks: merge_layer_vars.yml
      loop: "{{ computer_setup_active_layers }}"
      loop_control:
        loop_var: _layer
        label: "{{ _layer.name }} (priority {{ _layer.priority }})"

    - name: Expose merged layer vars as the role interface
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_merged_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Re-apply the answers over the merged layer vars
      # Second application: makes the answer win over a layer var of the same name.
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ computer_setup_answer_vars | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: Build the cross-layer file and template search paths
  ansible.builtin.set_fact:
    computer_setup_file_search_dirs: >-
      {{ _names | map('regex_replace', '^(.*)$', computer_setup_layer_cache + '/\1/files') | list }}
    computer_setup_template_search_dirs: >-
      {{ _names | map('regex_replace', '^(.*)$', computer_setup_layer_cache + '/\1/templates') | list }}
  vars:
    _names: "{{ computer_setup_active_layers | reverse | map(attribute='name') | list }}"

- name: Merge each layer's capabilities.yml into the capability registry
  ansible.builtin.include_tasks: merge_layer_capabilities.yml
  loop: "{{ computer_setup_active_layers }}"
  loop_control:
    loop_var: _layer
    label: "{{ _layer.name }}"

- name: Find selected capabilities no layer declares
  # Dropped by the registry lookups below, so a removed or renamed capability would silently stop installing. A fact so a test can read it.
  ansible.builtin.set_fact:
    computer_setup_unknown_selections: >-
      {{ (selected_capabilities | default([], true))
         | reject('in', computer_setup_capability_registry) | list }}

- name: Warn about them
  # A warning: a layer that briefly failed to load must not stop the run.
  ansible.builtin.debug:
    msg: >-
      machine.yml selects capability id(s) no layer declares, so they are
      ignored: {{ computer_setup_unknown_selections | join(', ') }}. Check the
      id, or whether the layer that provided it is still listed.
      `computer-setup layers lint` reports the same.
  when: computer_setup_unknown_selections | length > 0

- name: Fold capability implications from the answers into the selection
  # A `select` option may declare `implies: [id, ...]`, the generic dependency
  # edge: choosing an editor selects the capability that installs it.
  ansible.builtin.set_fact:
    selected_capabilities: "{{ (_selected + _implied) | unique | list }}"
  vars:
    _selected: "{{ selected_capabilities | default([], true) }}"
    _implied: >-
      {{ computer_setup_question_registry | dict2items
         | map(attribute='value') | selectattr('options', 'defined')
         | map(attribute='options') | flatten
         | selectattr('value', 'in', computer_setup_answers.values() | list)
         | selectattr('implies', 'defined') | map(attribute='implies')
         | flatten | unique | list }}

- name: Probe for adoptable capabilities already present
  # `adopt_if_present: <path>` makes a capability active when that path exists,
  # even if never selected. See "The capability model" in docs/architecture.md.
  ansible.builtin.stat:
    path: "{{ item.value.adopt_if_present }}"
  loop: >-
    {{ computer_setup_capability_registry | dict2items
       | selectattr('value.adopt_if_present', 'defined') | list }}
  loop_control:
    label: "{{ item.key }}"
  register: _adopt_probe

- name: Resolve active capabilities (selected + adoptable-present)
  ansible.builtin.set_fact:
    computer_setup_active_capabilities: "{{ (_selected + _present) | unique | list }}"
  vars:
    _selected: "{{ selected_capabilities | default([], true) }}"
    _present: >-
      {{ _adopt_probe.results
         | selectattr('stat.exists') | map(attribute='item.key') | list }}

- name: Derive the role interface from capabilities
  ansible.builtin.set_fact:
    # Packages and extensions from SELECTED capabilities; config and reminders
    # from ACTIVE ones. Both are mappings of manager -> space-separated names,
    # folded here into manager -> list across every selected capability.
    computer_setup_packages_optional: >-
      {%- set ns = namespace(out={}) -%}
      {%- for e in _selected_entries if e.packages is defined -%}
        {%- for m, names in e.packages.items() -%}
          {%- set ns.out = ns.out | combine({m: ns.out.get(m, []) + (names | split)}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.out }}
    extension_optional: >-
      {%- set ns = namespace(out={}) -%}
      {%- for e in _selected_entries if e.extensions is defined -%}
        {%- for m, names in e.extensions.items() -%}
          {%- set ns.out = ns.out | combine({m: ns.out.get(m, []) + (names | split)}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.out }}
    # Flattened list of config deploys ({src, dest, executable?}) from active caps.
    computer_setup_config_deploys: >-
      {{ _active_entries | selectattr('config', 'defined')
         | map(attribute='config') | flatten | list }}
    # Post-setup reminder strings contributed by active capabilities.
    computer_setup_reminders: >-
      {{ _active_entries | selectattr('reminders', 'defined')
         | map(attribute='reminders') | flatten | list }}
  vars:
    _selected: "{{ selected_capabilities | default([], true) }}"
    _active: "{{ computer_setup_active_capabilities }}"
    _selected_entries: >-
      {{ _selected | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry) | list }}
    _active_entries: >-
      {{ _active | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry) | list }}

# What the packages role installs: the layers' `packages_baseline` plus the
# selected capabilities' packages, for the managers this machine has only.
- name: Resolve the managed packages per detected manager
  ansible.builtin.set_fact:
    computer_setup_packages: >-
      {%- set ns = namespace(out={}) -%}
      {%- for m in computer_setup_package_managers -%}
        {%- set ns.out = ns.out | combine({m: ((_baseline[m] | default([], true))
                                               + computer_setup_packages_optional.get(m, [])) | unique | list}) -%}
      {%- endfor -%}
      {{ ns.out }}
  vars:
    _baseline: "{{ packages_baseline | default({}, true) }}"

- name: Find selected capabilities with no package for this machine's managers
  # A brew-only capability selected on Linux (or the reverse) installs nothing; say so rather than pass silently.
  ansible.builtin.set_fact:
    computer_setup_uninstallable_selections: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for e in _entries -%}
        {%- if not (e.packages.keys() | list | intersect(computer_setup_package_managers)) -%}
          {%- set ns.ids = ns.ids + [e.id] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
  vars:
    _entries: >-
      {{ selected_capabilities | default([], true)
         | select('in', computer_setup_capability_registry)
         | map('extract', computer_setup_capability_registry)
         | selectattr('packages', 'defined') | list }}

- name: Warn about them
  ansible.builtin.debug:
    msg: >-
      Selected capability id(s) declare no package for any package manager on
      this machine ({{ computer_setup_package_managers | join(', ') or 'none detected' }}),
      so nothing is installed for them: {{ computer_setup_uninstallable_selections | join(', ') }}.
      Their config still deploys.
  when: computer_setup_uninstallable_selections | length > 0
