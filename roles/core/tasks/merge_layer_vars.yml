---
# Merge a single content layer's vars into the accumulated merged set: its
# `vars.yml`, then `vars/<platform>.yml` for this machine's platform profile, so
# a layer can keep platform-only values out of every other platform's run.
# Loop var: `_layer` — a manifest entry: { name, priority }.

- name: "[{{ _layer.name }}] Read layer manifest"
  ansible.builtin.include_vars:
    file: "{{ computer_setup_layer_cache }}/{{ _layer.name }}/layer.yml"
    name: _layer_manifest

- name: "[{{ _layer.name }}] Assert supported schema_version"
  ansible.builtin.assert:
    that:
      - (_layer_manifest.schema_version | default(1) | int) == (computer_setup_schema_version | int)
    fail_msg: >-
      Layer '{{ _layer.name }}' requires schema_version
      {{ _layer_manifest.schema_version | default(1) }}, but this orchestrator
      supports {{ computer_setup_schema_version }}. Update the layer, or if it was
      just synced by an older runner, re-run `computer-setup layers sync` (or bootstrap.sh).
    quiet: true

- name: "[{{ _layer.name }}] Merge each vars file"
  ansible.builtin.include_tasks: merge_layer_vars_file.yml
  loop:
    - vars.yml
    - "vars/{{ computer_setup_platform.name }}.yml"
  loop_control:
    loop_var: _vars_file
