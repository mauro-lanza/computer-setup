---
# One extension manager. Loop var: `_mgr`.
- name: "[{{ _mgr.id }}] Detect the editor binary"
  ansible.builtin.stat:
    path: "{{ _mgr.binary }}"
  register: _mgr_stat

# Everything below is skipped when the editor is not installed. The manager may
# be active because its capability was selected in the same run, in which case
# Homebrew has already installed it (the homebrew role runs first).
- name: "[{{ _mgr.id }}] Manage extensions and settings"
  when: _mgr_stat.stat.exists
  block:
    - name: "[{{ _mgr.id }}] List installed extensions"
      ansible.builtin.command:
        argv: "{{ [_mgr.binary] + (_mgr.list_args | default(['--list-extensions'])) }}"
      register: _mgr_installed
      changed_when: false
      # Read-only, and needed under --check too: otherwise the list is empty and
      # the drift agent reports every managed extension as missing.
      check_mode: false

    - name: "[{{ _mgr.id }}] Resolve which managed extensions are missing"
      ansible.builtin.set_fact:
        _mgr_missing: >-
          {{ (extension_optional | default({})).get(_mgr.id, [])
             | unique
             | reject('in', _mgr_installed.stdout_lines | default([]))
             | list }}

    # `command` is skipped under --check, so the install task can never report
    # drift. This check-mode-only task supplies that signal; on a real apply the
    # install task reports the change itself.
    - name: "[{{ _mgr.id }}] Report missing extensions as drift"
      ansible.builtin.debug:
        msg: >-
          {{ _mgr_missing | length }} managed {{ _mgr.id }} extension(s) not
          installed: {{ _mgr_missing | join(', ') }}
      changed_when: true
      when:
        - ansible_check_mode
        - _mgr_missing | default([]) | length > 0

    - name: "[{{ _mgr.id }}] Install missing extensions"
      ansible.builtin.command:
        argv: "{{ [_mgr.binary] + (_mgr.install_args | default(['--install-extension'])) + [item] }}"
      loop: "{{ _mgr_missing | default([]) }}"
      register: _mgr_install
      changed_when: "'already installed' not in (_mgr_install.stdout | default(''))"

    - name: "[{{ _mgr.id }}] Deploy editor settings from layers"
      ansible.builtin.include_role:
        name: core
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: "{{ _mgr.settings_key }}"
        computer_setup_deploy_dest: "{{ _mgr.settings_dest }}"
      when:
        - _mgr.settings_key is defined
        - _mgr.settings_dest is defined
