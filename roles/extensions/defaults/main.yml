---
# Editor extension managers, supplied as layer data — adding Cursor or VSCodium
# is a layer edit, not an engine change. See "The engine names no tool" in
# docs/architecture.md.
#
# Item schema:
#   id            matches a capability's `manager:`
#   capability    active-capability gate for this manager
#   binary        absent binary = manager skipped
#   list_args     default [--list-extensions]
#   install_args  default [--install-extension]
#   settings_key  layer file/template key (optional)
#   settings_dest where those settings are written (optional)
extension_managers: []

# Extensions opted into via capabilities — derived by the engine from the
# selected capabilities of `type: extension`, keyed by manager id. There is
# deliberately no "always install these" list beside it: a capability that should
# always apply is one a preset always selects, which keeps the selection visible
# in the prefs file rather than as invisible layer state.
extension_optional: {}
