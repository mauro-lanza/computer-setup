---
# Converges the engine runtime on runtime.yml; runs under the runtime it manages, so the current run finishes on the old version.
- name: Ensure the runtime directory exists
  ansible.builtin.file:
    path: "{{ computer_setup_runtime_dir }}"
    state: directory
    mode: "0755"

# Read-only probes; see "Probes under --check" in docs/architecture.md.
- name: Read the interpreters uv has installed
  ansible.builtin.command:
    argv: ["{{ homebrew_prefix }}/bin/uv", "python", "list", "--only-installed"]
  register: runtime_pythons
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the installed mitogen version
  ansible.builtin.command:
    argv:
      - "{{ computer_setup_runtime_tools }}/ansible-core/bin/python"
      - -c
      # mitogen.__version__ is a tuple; normalised here because Jinja cannot compare it against the pin.
      - "import mitogen; print('.'.join(str(p) for p in mitogen.__version__))"
  register: runtime_mitogen
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the installed ansible-core version
  ansible.builtin.command:
    argv: ["{{ computer_setup_runtime_bin }}/ansible", "--version"]
  register: runtime_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide what the runtime needs
  ansible.builtin.set_fact:
    # uv names them `cpython-<version>-<platform>`; matching on the minor keeps uv's stable path across patches.
    runtime_python_missing: >-
      {{ ('cpython-' ~ computer_setup_runtime_pins.python) not in (runtime_pythons.stdout | default('')) }}
    runtime_core_wrong: >-
      {{ ('core ' ~ computer_setup_runtime_pins.ansible_core ~ ']') not in (runtime_installed.stdout | default('')) }}
    runtime_mitogen_wrong: >-
      {{ computer_setup_runtime_pins.mitogen != (runtime_mitogen.stdout | default('') | trim) }}

# ─── Converge ────────────────────────────────────────────────────────────────
- name: Install the pinned Python
  ansible.builtin.command:
    argv: ["{{ homebrew_prefix }}/bin/uv", "python", "install", "{{ computer_setup_runtime_pins.python }}"]
  changed_when: true
  when: runtime_python_missing | bool

- name: Install or re-pin the engine runtime
  ansible.builtin.command:
    argv:
      - "{{ homebrew_prefix }}/bin/uv"
      - tool
      - install
      - --force
      - --python
      - "{{ computer_setup_runtime_pins.python }}"
      - --with
      - "mitogen=={{ computer_setup_runtime_pins.mitogen }}"
      - "ansible-core=={{ computer_setup_runtime_pins.ansible_core }}"
  environment:
    UV_TOOL_DIR: "{{ computer_setup_runtime_tools }}"
    UV_TOOL_BIN_DIR: "{{ computer_setup_runtime_bin }}"
  changed_when: true
  when: (runtime_core_wrong | bool) or (runtime_mitogen_wrong | bool)

# Check mode skips the install tasks above; this reports the drift instead.
- name: Report a runtime that does not match the pin
  ansible.builtin.debug:
    msg: >-
      Engine runtime differs from runtime.yml
      (want python {{ computer_setup_runtime_pins.python }}, ansible-core {{ computer_setup_runtime_pins.ansible_core }},
      mitogen {{ computer_setup_runtime_pins.mitogen }}).
      Reconcile with `computer-setup apply --tags runtime`.
  changed_when: true
  when:
    - ansible_check_mode
    - (runtime_python_missing | bool) or (runtime_core_wrong | bool)
      or (runtime_mitogen_wrong | bool)
