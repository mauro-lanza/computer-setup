---
- name: Ensure ~/.dbt directory exists
  ansible.builtin.file:
    path: "{{ dbt_config_dir }}"
    state: directory
    mode: "0755"

# The dbt profile content (BigQuery targets, etc.) is layer-provided. Resolve a
# profiles.yml.j2 across layer templates/ dirs (highest priority wins) and render
# it. Skipped entirely if no layer supplies one.
- name: Resolve dbt profiles template from layers
  ansible.builtin.set_fact:
    dbt_profiles_src: "{{ lookup('ansible.builtin.first_found', _params, errors='ignore') }}"
  vars:
    _params:
      files: [profiles.yml.j2]
      paths: "{{ (computer_setup_template_search_dirs | default([])) + [role_path + '/templates'] }}"

- name: Deploy dbt profiles.yml
  ansible.builtin.template:
    src: "{{ dbt_profiles_src }}"
    dest: "{{ dbt_config_dir }}/profiles.yml"
    mode: "0644"
  when: dbt_profiles_src | default('') | length > 0
