---
- name: Deploy dbt profiles.yml from layers
  ansible.builtin.include_role:
    name: computer_setup
    tasks_from: deploy_layer_file
  vars:
    computer_setup_lookup_key: profiles.yml.j2
    computer_setup_deploy_dest: "{{ dbt_config_dir }}/profiles.yml"
    computer_setup_lookup_fallback_dir: "{{ role_path }}/templates"
    computer_setup_deploy_kind: template
