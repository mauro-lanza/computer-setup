name: example
# The plugin schema version this layer targets. The orchestrator refuses to
# load a layer whose schema_version exceeds what it supports.
schema_version: 1
# Merge order across layers. Layers are applied in ascending priority, so a
# higher number wins on scalar conflicts. Lists append across all layers.
priority: 50
# Which parts of the contract this layer supplies. Informational.
provides: [capabilities, vars, files, templates]
description: >-
  Reference content layer. Copy this directory into a new git repo to create
  your own layer. Delete the parts you don't need — every file except plugin.yml
  is optional.
