---
# capabilities.yml — selectable capabilities offered in bootstrap's menu and
# merged into the engine's capability registry (union by id across layers).
#
# The `id` IS the capability token. Schema per item:
#   id:               stable primary key (never rename; remembers prior answers)
#   desc:             human-readable label shown in the prompt
#   packages:         (optional) package manager -> space-separated names,
#                     installed when selected. Each manager installs only where
#                     the engine detects it, so one capability spans platforms:
#                       brew:    Homebrew formulae (macOS); `owner/tap/name`
#                                adds the tap `owner/tap` first
#                       cask:    Homebrew casks (macOS)
#                       pacman:  Arch repository packages
#                       aur:     AUR packages, built with paru
#                       flatpak: flathub app ids, user installation
#   extensions:       (optional) extension manager id (an `extension_managers`
#                     entry in vars) -> space-separated extension ids
#   requires:         (optional) another capability id; only prompt when that
#                     one is selected earlier in the run or already present
#   config:           (optional) files/templates deployed when the capability is
#                     active (highest-priority layer supplies the file):
#                       - { src: <lookup key>, dest: <path>, executable: bool }
#                     `src` is written WITHOUT any .j2 suffix: templates/<src>.j2
#                     wins if it exists, else files/<src> is copied verbatim.
#                     `executable: true` deploys 0755 (for files on PATH). The
#                     mode is otherwise left unmanaged, so a tool that chmods
#                     its own config file is not reported as drift forever.
#   adopt_if_present: (optional) a path; when it exists the capability is active
#                     even if not selected (adopt an existing install).
#                     Only `{{ home_dir }}` and `{{ homebrew_prefix }}` are
#                     expanded here — this is also read by bootstrap, before
#                     Ansible exists to template anything else.
#   reminders:        (optional) post-setup message strings shown when active
#
# A capability with none of packages/extensions/config is just a flag other
# content can gate on (`# cs:requires-capability:`, `requires_capability:`).

capabilities:
  # One capability for both platforms: brew on macOS, pacman on Arch.
  - id: ripgrep
    desc: "ripgrep (fast search)"
    packages:
      brew: ripgrep
      pacman: ripgrep

  - id: vlc
    desc: "VLC media player"
    packages:
      cask: vlc
      flatpak: org.videolan.VLC

  - id: vscode-spell-checker
    desc: "VS Code: Code Spell Checker"
    extensions:
      vscode: streetsidesoftware.code-spell-checker   # an `extension_managers` id in vars
    requires: vscode

  # A capability with no package: selecting it just deploys config.
  # Shows both kinds — a plain file from files/, and a rendered template
  # from templates/.
  - id: example-tool
    desc: "Example config-only tool"
    adopt_if_present: "{{ home_dir }}/.config/example/config.toml"
    config:
      - src: example/config.toml
        dest: "{{ home_dir }}/.config/example/config.toml"
      - src: example.conf
        dest: "{{ home_dir }}/.config/example/example.conf"
