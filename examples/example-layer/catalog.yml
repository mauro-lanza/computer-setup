---
# catalog.yml — optional menu items merged into bootstrap's prompt (union by id).
#
# Schema per item:
#   id:               stable primary key (used to remember prior y/N answers)
#   desc:             human-readable label shown in the prompt
#   type:             formula | cask | vscode
#   packages:         space-separated brew formulae / casks / extension IDs
#   requires_vscode:  (optional bool) only prompt when VS Code is available

catalog:
  - id: htop
    desc: "htop (interactive process viewer)"
    type: formula
    packages: htop

  - id: vlc
    desc: "VLC media player"
    type: cask
    packages: vlc

  - id: vscode-spell-checker
    desc: "VS Code: Code Spell Checker"
    type: vscode
    packages: streetsidesoftware.code-spell-checker
    requires_vscode: true
