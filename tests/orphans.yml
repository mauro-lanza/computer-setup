---
# Second phase of the manifest contract: what happens when a path STOPS being
# managed. Run after tests/manifest.yml with the same `m` (scratch dir, passed
# with -e): this declares the same directory minus the looped files
# and the backup, so those paths become orphans.
- name: Exercise orphan detection
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: A managed directory
      ansible.builtin.file:
        path: "{{ m }}"
        state: directory
        mode: "0755"

    # The only file still declared. Everything tests/manifest.yml wrote and this
    # does not is now unmanaged but still on disk.
    - name: The one file still managed
      ansible.builtin.copy:
        dest: "{{ m }}/managed.conf"
        content: "v2\n"
        mode: "0644"
