---
# Negative-path harness. Loads ONLY the orchestration role, so a run either
# initializes cleanly or fails on a guard. Point it at a fixture set with -e:
#
#   ansible-playbook tests/negative.yml \
#     -e computer_setup_plugin_cache=tests/fixtures/negative/reserved/plugins \
#     -e computer_setup_layers_manifest=tests/fixtures/negative/reserved/layers.yml
#
# scripts/check.sh asserts these FAIL. Reserved-key enforcement and
# schema_version rejection are both documented as guarantees and both had zero
# coverage — a silently-degraded guard (an expression that always evaluates
# false) would have looked exactly like a passing test suite.
- name: Layer contract negative paths
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    home_dir: "{{ ansible_facts['env']['HOME'] }}"
    vscode_code_binary: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    # Mirrors local.yml — layer `repositories:` entries template against it.
    repositories_base_dir: "{{ ansible_facts['env']['HOME'] }}/Projects"
    homebrew_prefix: /opt/homebrew
    computer_setup_prefs_file: "{{ playbook_dir }}/fixtures/prefs.yml"
    computer_setup_schema_version: 1
  tasks:
    - name: Initialize computer-setup orchestration
      ansible.builtin.import_role:
        name: computer_setup
