---
- name: Validate layer contract
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    home_dir: "{{ ansible_facts['env']['HOME'] }}"
    computer_setup_layer_cache: "{{ playbook_dir }}/fixtures/layers_cache"
    computer_setup_layers_manifest: "{{ playbook_dir }}/fixtures/layers.yml"
    computer_setup_prefs_file: "{{ playbook_dir }}/fixtures/prefs.yml"
    computer_setup_schema_version: 1
  pre_tasks:
    - name: Initialize computer-setup orchestration
      ansible.builtin.import_role:
        name: computer_setup
      tags: [always]
  tasks:
    - name: Create a scratch dir for deploy assertions
      ansible.builtin.tempfile:
        state: directory
      register: contract_scratch

    - name: Deploy fixture file via the engine primitive
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: contract.txt
        computer_setup_deploy_dest: "{{ contract_scratch.path }}/nested/contract.txt"

    - name: Deploy a key promoted from a file to a template
      # `promoted.conf` is supplied as files/promoted.conf by the HIGHER-priority
      # layer and as templates/promoted.conf.j2 by the LOWER-priority one. The
      # template must win: promotion is a property of the key, not of priority.
      # This is what lets one value reach several config files.
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: promoted.conf
        computer_setup_deploy_dest: "{{ contract_scratch.path }}/nested/promoted.conf"

    - name: Deploy fixture template via the engine primitive
      # The key never carries the .j2 suffix: `contract.out` resolves
      # templates/contract.out.j2 by the one two-step rule, highest layer first.
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: contract.out
        computer_setup_deploy_dest: "{{ contract_scratch.path }}/nested/contract.out"

    # No layer provides this key. Must no-op: first_found(errors=ignore)
    # no-op: first_found(errors=ignore) returns None, and `default('') | length`
    # raises on it unless the primitive guards for that.
    - name: Deploy a key that no layer provides (must no-op, not fail)
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: no-layer-provides-this.txt
        computer_setup_deploy_dest: "{{ contract_scratch.path }}/absent/should-not-exist.txt"

    - name: Stat the unprovided destination
      ansible.builtin.stat:
        path: "{{ contract_scratch.path }}/absent/should-not-exist.txt"
      register: contract_unprovided

    - name: Read back the deployed file
      ansible.builtin.slurp:
        src: "{{ contract_scratch.path }}/nested/contract.txt"
      register: contract_deployed_file

    - name: Read back the promoted (file -> template) deployment
      ansible.builtin.slurp:
        src: "{{ contract_scratch.path }}/nested/promoted.conf"
      register: contract_promoted

    - name: Read back the deployed template
      ansible.builtin.slurp:
        src: "{{ contract_scratch.path }}/nested/contract.out"
      register: contract_deployed_template

    - name: Assert layer merge and resolution contract
      ansible.builtin.assert:
        that:
          - computer_setup_active_layers | map(attribute='name') | list == ['base', 'override']
          - contract_list == ['base', 'override']
          - contract_scalar == 'override'
          # Union-by-id: `nvm` exists in both layers; the higher-priority one
          # replaces it wholesale, so the package is override's, not base's.
          - computer_setup_capability_registry['nvm'].packages == 'nvm-from-override'
          - "'override wins' in computer_setup_capability_registry['nvm'].desc"
          # Packages derive from SELECTED capabilities only. 'ghost' is selected
          # but unregistered (silently ignored); 'adopted' is registered and
          # active but never selected, so its package must NOT appear here.
          - homebrew_optional_formulae == ['nvm-from-override', 'anomalyco/tap/opencode']
          - homebrew_optional_casks == ['zed', 'visual-studio-code']
          # type: extension routes to its MANAGER's bucket, not formulae/casks.
          # The engine names no editor; 'vscode' here is the layer's manager id.
          - extension_optional.keys() | list == ['vscode']
          - extension_optional['vscode'] == ['johnpapa.vscode-peacock']
          # Gating is capability membership in the active set. 'adopted' is not
          # selected but its adopt_if_present path exists, so it becomes active.
          - "'nvm' in computer_setup_active_capabilities"
          - "'zed' in computer_setup_active_capabilities"
          - "'vscode' in computer_setup_active_capabilities"
          - "'dbt' in computer_setup_active_capabilities"
          - "'adopted' in computer_setup_active_capabilities"
          # A selected-but-unregistered capability is still "active" (a selection),
          # it just contributes no packages/config.
          - "'ghost' in computer_setup_active_capabilities"
          # Config deploys are the config bundles of ACTIVE capabilities, in
          # capability order (zed at pos 3, dbt at pos 5; vscode declares no
          # `config:` — editor settings come from its extension_managers entry).
          - computer_setup_config_deploys | length == 2
          - computer_setup_config_deploys[0].src == 'zed/settings.json'
          - computer_setup_config_deploys[0].dest == '/tmp/cs-contract/zed-settings.json'
          - computer_setup_config_deploys[1].src == 'profiles.yml'
          # Reminders come from ACTIVE capabilities: 'vscode' is selected, and
          # 'adopted' contributes despite never being selected.
          - "'Sign into VS Code settings sync' in computer_setup_reminders"
          - "'Adopted capability reminder' in computer_setup_reminders"
          # deploy_layer_file: highest-priority layer wins, parent dir is created
          - (contract_deployed_file.content | b64decode | trim) == 'override file'
          - (contract_deployed_template.content | b64decode | trim) == 'override template'
          # A key supplied as templates/<key>.j2 is RENDERED even when a
          # higher-priority layer supplies files/<key> verbatim.
          - >-
            (contract_promoted.content | b64decode | trim)
            == 'rendered from base: override'
          # ── Questions and answers ──────────────────────────────────────
          # The higher-priority layer's entry for a shared id wins outright.
          - computer_setup_question_registry['editor'].desc == 'Default editor (override)'
          # A stored answer is used...
          - computer_setup_answers['editor'] == 'picked'
          # ...an unanswered question falls back to its declared default...
          - computer_setup_answers['unanswered'] == 'fallback-value'
          # ...and an answer to a question no layer declares is DROPPED, rather
          # than carried into play scope as a phantom var.
          - "'phantom' not in computer_setup_answers"
          # The chosen option's `set:` payload reached play scope.
          - contract_editor_cmd == 'from-override-option'
          # A question-level `set_var:` assigns the raw answer.
          - contract_unanswered_var == 'fallback-value'
          # `implies:` is the generic dependency edge, replacing requires_vscode.
          - "'implied-cap' in selected_capabilities"
          - "'implied-cap' in computer_setup_active_capabilities"
          # ORDERING, both directions. A layer var templates against an answer
          # (answers applied BEFORE the merge)...
          - contract_repo_path == '/tmp/contract-repos/thing'
          # ...and an answer still beats a layer var of the same name (applied
          # again AFTER the merge). override/vars.yml sets contract_editor_cmd.
          - contract_editor_cmd == 'from-override-option'
          # Machine tier: a question MAY set keys a layer's vars.yml may not.
          # tests/fixtures/negative/machine-tier asserts the other half — that a
          # layer var naming the same key is still rejected.
          - repositories_base_dir == '/tmp/contract-repos'
          - drift_correction_enabled | bool
          # Commit identity is machine tier: the layer PROPOSES it through a
          # question and, unanswered here, its default is what reaches the
          # engine. This is what lets a private layer carry an account's noreply
          # address instead of it being retyped at every rebuild.
          - git_user_email == 'layer-default@example.com'
          # `validate` is registered so the engine can re-check a hand-edited
          # prefs file, not just the bootstrap prompt.
          - computer_setup_question_registry['git-email'].validate is defined
          # An unprovided key deploys nothing and does not create the parent dir.
          # This runs AFTER several successful deploys, so it also asserts the
          # primitive resets its resolution state between invocations rather than
          # inheriting the previous key's source.
          - not contract_unprovided.stat.exists

    - name: Clean up scratch dir
      ansible.builtin.file:
        path: "{{ contract_scratch.path }}"
        state: absent
