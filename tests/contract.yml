---
- name: Validate layer contract
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    home_dir: "{{ ansible_facts['env']['HOME'] }}"
    vscode_code_binary: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    computer_setup_plugin_cache: "{{ playbook_dir }}/fixtures/plugins"
    computer_setup_layers_manifest: "{{ playbook_dir }}/fixtures/layers.yml"
    computer_setup_prefs_file: "{{ playbook_dir }}/fixtures/prefs.yml"
    computer_setup_schema_version: 1
  pre_tasks:
    - name: Initialize computer-setup orchestration
      ansible.builtin.import_role:
        name: computer_setup
      tags: [always]
  tasks:
    - name: Resolve fixture file
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: resolve_layer_file
      vars:
        computer_setup_lookup_key: contract.txt
        computer_setup_lookup_result_var: contract_file_src
        computer_setup_lookup_fallback_dir: "{{ playbook_dir }}/missing-files"

    - name: Resolve fixture template
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: resolve_layer_template
      vars:
        computer_setup_lookup_key: contract.j2
        computer_setup_lookup_result_var: contract_template_src
        computer_setup_lookup_fallback_dir: "{{ playbook_dir }}/missing-templates"

    - name: Create a scratch dir for deploy assertions
      ansible.builtin.tempfile:
        state: directory
      register: contract_scratch

    - name: Deploy fixture file via the engine primitive
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: contract.txt
        computer_setup_deploy_dest: "{{ contract_scratch.path }}/nested/contract.txt"
        computer_setup_lookup_fallback_dir: "{{ playbook_dir }}/missing-files"

    - name: Deploy fixture template via the engine primitive
      ansible.builtin.include_role:
        name: computer_setup
        tasks_from: deploy_layer_file
      vars:
        computer_setup_lookup_key: contract.j2
        computer_setup_deploy_dest: "{{ contract_scratch.path }}/nested/contract.out"
        computer_setup_lookup_fallback_dir: "{{ playbook_dir }}/missing-templates"
        computer_setup_deploy_kind: template

    - name: Read back the deployed file
      ansible.builtin.slurp:
        src: "{{ contract_scratch.path }}/nested/contract.txt"
      register: contract_deployed_file

    - name: Read back the deployed template
      ansible.builtin.slurp:
        src: "{{ contract_scratch.path }}/nested/contract.out"
      register: contract_deployed_template

    - name: Assert layer merge and resolution contract
      ansible.builtin.assert:
        that:
          - computer_setup_active_layers | map(attribute='name') | list == ['base', 'override']
          - contract_list == ['base', 'override']
          - contract_scalar == 'override'
          # Optional packages are derived from selected_capabilities x the merged
          # capability registry (order follows the selection order).
          - computer_setup_capabilities == ['nvm', 'opencode', 'zed', 'vscode', 'dbt']
          - homebrew_optional_formulae == ['nvm', 'anomalyco/tap/opencode']
          - homebrew_optional_casks == ['zed', 'visual-studio-code']
          - vscode_optional_extensions == []
          - has_nvm | bool
          - has_zed | bool
          - has_opencode | bool
          - has_vscode | bool
          - has_dbt | bool
          - contract_file_src.endswith('/override/files/contract.txt')
          - contract_template_src.endswith('/override/templates/contract.j2')
          # deploy_layer_file: highest-priority layer wins, parent dir is created
          - (contract_deployed_file.content | b64decode | trim) == 'override file'
          - (contract_deployed_template.content | b64decode | trim) == 'override template'

    - name: Clean up scratch dir
      ansible.builtin.file:
        path: "{{ contract_scratch.path }}"
        state: absent
