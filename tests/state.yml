---
# Drives the computer_setup_state callback plugin so its output can be asserted.
#
# Deliberately standalone: no layer machinery, no core role. This is a test of
# the RUN-STATE CONTRACT — the JSON shape `computer-setup status` reads and any
# UI would consume — not of the engine's layer merge, which contract.yml covers.
#
# The file content below is a canary. The plugin records metadata only, so this
# string must never reach the state file; check.sh asserts exactly that. If
# someone "improves" the plugin by recording diffs, this is what catches it
# before a machine's gitconfig identity ends up in a world-readable report.
- name: Exercise the run-state callback
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    state_scratch: /tmp/cs-state-contract
  tasks:
    - name: Ensure a stale destination exists
      ansible.builtin.copy:
        dest: "{{ state_scratch }}.txt"
        content: "stale\n"
        mode: "0600"
      check_mode: false
      # Scaffolding, not the subject. Without this it reports changed on the
      # first run and not on later ones, making the assertion below depend on
      # whether /tmp happened to be clean.
      changed_when: false

    - name: A task that would change a file
      ansible.builtin.copy:
        dest: "{{ state_scratch }}.txt"
        content: "CANARY-DO-NOT-RECORD-a3f9\n"
        mode: "0600"

    - name: A task that changes nothing
      ansible.builtin.debug:
        msg: unchanged

    # A TEMPLATE, not a copy. Its diff's `after_header` is Ansible's temporary
    # rendered source (…/ansible-local-*/tmp*/x.j2), so a plugin that trusts
    # `after_header` records a path in a temp dir that no longer exists. This is
    # the regression that shipped once; `dest` here must be the real file.
    - name: Render a template that would change
      ansible.builtin.template:
        src: state_probe.j2
        dest: "{{ state_scratch }}-template.txt"
        mode: "0600"

    # A LOOPED task. Its task-level `dest` is still the unrendered
    # "{{ item.dest }}", and the real paths live in per-item sub-results. Both
    # items must appear separately — a single entry naming neither file is
    # most of the information lost.
    - name: Render templates in a loop
      ansible.builtin.template:
        src: state_probe.j2
        dest: "{{ item.dest }}"
        mode: "0600"
      loop:
        - { dest: "{{ state_scratch }}-loop-a.txt" }
        - { dest: "{{ state_scratch }}-loop-b.txt" }

    # A looped task with NO path — the shape a credential check or a package
    # loop has. Without the item label such entries are indistinguishable from
    # each other in the state file, which is the whole point of recording them.
    - name: A looped task that changes but touches no file
      ansible.builtin.command: "true"
      # Read-only probes run under --check so drift is visible; without this the
      # command module is skipped and the case under test never happens.
      check_mode: false
      changed_when: true
      loop:
        - alpha-item
        - beta-item
      loop_control:
        label: "{{ item }}"
