---
capabilities:
  # Union-by-id collision: `nvm` is ALSO defined in the base layer. The higher
  # priority layer must win outright (desc AND packages), not merge field-wise.
  # Until this fixture existed, base and override shared zero ids, so the
  # combine() implementing the documented "higher priority wins" rule was never
  # exercised — a regression making the LOWER layer win passed the whole suite.
  - id: nvm
    desc: "Node Version Manager (override wins)"
    packages:
      brew: nvm-from-override
  - id: vscode
    desc: "Visual Studio Code"
    packages:
      cask: visual-studio-code
    reminders: ["Sign into VS Code settings sync"]
  # A capability with no package (feature) — e.g. a config-only tool.
  - id: dbt
    desc: "dbt (BigQuery profile)"
    config:
      - {src: profiles.yml, dest: "/tmp/cs-contract/dbt-profiles.yml"}
  # `extensions:` is keyed by the layer's extension manager, not a package
  # manager. Asserted by identity, not just "== {}", which would pass even if
  # the derivation returned nothing.
  - id: vscode-peacock
    desc: "VS Code: Peacock"
    extensions:
      vscode: johnpapa.vscode-peacock
  # One capability, several managers: each manager's names land in its own list,
  # and brew's join the other capabilities' brew names.
  - id: ripgrep
    desc: "ripgrep (both platforms)"
    packages:
      brew: ripgrep
      pacman: ripgrep
      flatpak: org.example.Rg
  # Installs nothing on a machine without pacman; core must name it.
  - id: pacman-only
    desc: "Only packaged for pacman"
    packages:
      pacman: only-pacman extra-pacman
