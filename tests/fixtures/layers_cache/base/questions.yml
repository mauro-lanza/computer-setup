---
questions:
  - id: editor
    type: select
    desc: "Default editor"
    default: base-default
    options:
      - value: base-default
        set: {contract_editor_cmd: from-base}
      - value: picked
        set: {contract_editor_cmd: from-override-option}
        implies: [implied-cap]
  - id: unanswered
    type: text
    desc: "Never answered — must fall back to its default"
    default: fallback-value
    set_var: contract_unanswered_var
  - id: repositories-dir
    type: path
    desc: "Machine tier: a question MAY set this, a layer var may NOT"
    default: /tmp/contract-repos
    set_var: repositories_base_dir
  - id: drift-agents
    type: bool
    desc: "Machine tier bool"
    default: "true"
    set_var: drift_correction_enabled
  # Commit identity is machine tier too: a layer PROPOSES it through a question
  # (so a private layer can pre-fill an account's noreply address) but a layer
  # var still may not set it. `validate` is the generic answer guard.
  - id: git-email
    type: text
    desc: "Machine tier: commit identity, proposed by a layer"
    default: layer-default@example.com
    set_var: git_user_email
    validate: "^[^ @]+@[^ @]+\\.[^ @]+$"
