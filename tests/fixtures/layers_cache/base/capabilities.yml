---
capabilities:
  - id: nvm
    desc: "Node Version Manager"
    packages:
      brew: nvm
  - id: opencode
    desc: "OpenCode CLI"
    packages:
      brew: anomalyco/tap/opencode
  - id: zed
    desc: "Zed editor"
    packages:
      cask: zed
    config:
      - {src: zed/settings.json, dest: "/tmp/cs-contract/zed-settings.json"}
  # Not selected, but adopted because its probe path exists. Contributes to the
  # active-derived interface (reminders) but not the selected-derived one
  # (packages) — that asymmetry is the point of adopt_if_present.
  - id: adopted
    desc: "Adopted-if-present demo"
    packages:
      brew: adopted-must-not-install
    adopt_if_present: "{{ playbook_dir }}/fixtures/layers_cache/base/files/contract.txt"
    reminders: ["Adopted capability reminder"]
