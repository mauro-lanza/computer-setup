---
# Answers to the layers' questions. `editor` is answered; `unanswered` is not
# (it must fall back to its declared default); `phantom` refers to a question no
# layer declares (it must be dropped, not carried into play scope). `git-email`
# is left unanswered so the LAYER's proposed default is what reaches the engine.
answers:
  editor: picked
  phantom: should-be-dropped

# Single selection token. Optional packages and capability flags are DERIVED
# from these ids against the merged capability registry (the layers. capabilities).
selected_capabilities:
  - nvm             # defined in BOTH layers — override must win
  - opencode        # base: formula anomalyco/tap/opencode
  - zed             # base: cask zed
  - vscode          # override: cask visual-studio-code
  - dbt             # override: feature (no package)
  - vscode-peacock  # override: type extension (manager: vscode)
  - ghost           # not in any active layer's capabilities — must be silently ignored
