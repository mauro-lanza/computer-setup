---
# Pinned to one major version: the 09:00 LaunchAgent runs `--upgrade`
# unattended, and every module this repo uses lives in community.general. Raise
# the ceiling deliberately, after running scripts/check.sh against the new major.
#
# `~=` is not supported — ansible-galaxy parses this with LooseVersion and
# rejects PEP 440 syntax. The comma-separated form is the supported spelling.
collections:
  - name: community.general
    version: ">=13.2.0,<14.0.0"
